const SecaoLivros=({student})=>{
  const [livros,setLivros]=useState(()=>{try{return JSON.parse(localStorage.getItem('mmc_livros')||'[]');}catch{return[];}});
  const [chatMsg,setChatMsg]=useState([{de:'ia',txt:'Olá! Sou o Tutor IA local da Matemática Inclusiva. Tenho uma base SESI indexada e também leio os PDFs que você importar. Pergunte, peça atividades ou solicite códigos das fases. 📚🤖'}]);
  const [input,setInput]=useState('');
  const [carregando,setCarregando]=useState(false);
  const msgsRef=useRef();
  const fileRef=useRef();

  useEffect(()=>{try{const meta=livros.map(r=>({...r,conteudo:(r.conteudo||'').slice(0,12000),indice:r.indice||indexarConteudoLivro(r.conteudo||'',r.nome||'')}));localStorage.setItem('mmc_livros',JSON.stringify(meta));}catch(e){}},[livros]);
  useEffect(()=>{if(msgsRef.current)msgsRef.current.scrollTop=msgsRef.current.scrollHeight;},[chatMsg]);

  const [lendo,setLendo]=useState(false);

  const addLivro=async(e)=>{
    const f=e.target.files[0];if(!f)return;
    e.target.value='';
    setLendo(true);
    let conteudo='';
    try{
      const buf=await f.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      const paginas=Math.min(pdf.numPages,40);
      for(let p=1;p<=paginas;p++){
        const pag=await pdf.getPage(p);
        const tc=await pag.getTextContent();
        const linhas=tc.items.map(i=>i.str).join(' ');
        conteudo+=linhas+'\n';
        if(conteudo.length>8000)break;
      }
      conteudo=conteudo.slice(0,12000);
    }catch(err){conteudo='';}
    const novo={id:Date.now(),nome:f.name.replace('.pdf',''),serie:'',disciplina:'Matemática',tamanho:Math.round(f.size/1024)+' KB',data:new Date().toLocaleDateString('pt-BR'),conteudo,paginas:paginas||0,indice:indexarConteudoLivro(conteudo,f.name)};
    setLivros(l=>[...l,novo]);
    setLendo(false);
    window.playSuccess&&window.playSuccess();
  };
  const removeLivro=(id)=>setLivros(l=>l.filter(x=>x.id!==id));

  const enviar=async()=>{
    if(!input.trim()||carregando)return;
    const pergunta=input.trim();setInput('');
    const novasMsgs=[...chatMsg,{de:'user',txt:pergunta}];
    setChatMsg(novasMsgs);
    setCarregando(true);
    try{
      // ── 1. Busca livros relevantes pelo índice ──
      const hitsLivros=buscarNoIndice(pergunta,livros);
      const contextoLivros=[
        ...hitsLivros.map(l=>{
          const cap=(l.capitulos||[]).slice(0,4).join('; ');
          const dest=(l.destaques||[]).slice(0,5).join(', ');
          const cod=(l.codigos||[]).slice(0,6).join(', ');
          const trecho=l.conteudo?`\nTrecho:\n${l.conteudo.slice(0,2000)}`:'';
          return `=== ${l.nome} (${l.serie||'SESI'}) ===\nCapítulos: ${cap}\nHabilidades: ${dest}\nCódigos BNCC: ${cod}${trecho}`;
        }),
        ...livros.filter(l=>l.conteudo&&!hitsLivros.find(h=>h.id===l.id)).slice(0,1).map(l=>`=== ${l.nome} (importado) ===\n${l.conteudo.slice(0,1000)}`),
      ].join('\n\n');

      // ── 2. Dados do aluno / condição ──
      const nomeCurto=student?.nome?.split(' ')[0]||'aluno';
      const condicao=student?.condicao||'não especificada';
      const ano=student?.ano||'não informado';
      const habCog=student?.habCognitivo||'';
      const desCog=student?.desCognitivo||'';

      // ── 3. System prompt rico ──
      const sistema=`Você é o TutorMat, assistente de matemática do SESI-SP para Educação Inclusiva.
Você tem acesso à internet (ferramenta web_search) para buscar exemplos atuais, imagens mentais e referências pedagógicas.

ALUNO ATUAL:
- Nome: ${nomeCurto} | Série: ${ano}
- Condição: ${condicao}
- Pontos fortes: ${habCog||'não informado'}
- Necessidades: ${desCog||'não informado'}

REGRAS DE RESPOSTA:
- Sempre em português brasileiro claro e objetivo
- Adapte a linguagem à condição do aluno (ex: TEA → direto e sem metáforas vagas; TDAH → frases curtas e enérgicas)
- Use exemplos do cotidiano (cozinha, dinheiro, jogos, esportes)
- Máximo 200 palavras. NUNCA deixe palavra ou frase cortada — termine sempre a ideia completa
- Se o assunto for matemático, inclua o raciocínio passo a passo
- Quando relevante, cite o livro SESI de onde veio o conteúdo e o código BNCC
- Use web_search se precisar de exemplos atuais, curiosidades motivadoras ou referências pedagógicas recentes

BASE DE LIVROS SESI INDEXADA:
${contextoLivros||'Base SESI local ativa (sem livros extras importados). Use o currículo SESI-SP como referência.'}`;

      // ── 4. Histórico da conversa (sem a saudação inicial) ──
      const historico=novasMsgs
        .slice(1) // remove saudação do tutor
        .map(m=>({role:m.de==='user'?'user':'assistant',content:m.txt}));

      // ── 5. Chamada à API com web_search ──
      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:600,
          system:sistema,
          tools:[{type:'web_search_20250305',name:'web_search'}],
          messages:historico
        })
      });
      const data=await resp.json();

      // ── 6. Extrai o texto (ignora blocos tool_use intermediários) ──
      let txt='';
      if(Array.isArray(data.content)){
        txt=data.content.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
      }
      if(!txt)txt='Desculpe, não consegui responder agora. Tente novamente!';

      setChatMsg(m=>[...m,{de:'ia',txt}]);
      window.playSuccess&&window.playSuccess();
    }catch(e){
      setChatMsg(m=>[...m,{de:'ia',txt:'Ops! Não consegui conectar agora. Verifique a internet e tente de novo! 😊'}]);
    }
    setCarregando(false);
  };

  const cores=['#4F9968','#4A82B4','#E96B4F','#7E5CC4','#E8AE2E'];
  return(
    <div>
      <div className="livros-area">
        {/* Biblioteca */}
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <h3 style={{margin:0,fontSize:18}}>📚 Minha Biblioteca</h3>
            <div style={{display:'flex',gap:8}}>
              <input ref={fileRef} type="file" accept=".pdf" onChange={addLivro} style={{display:'none'}}/>
              <button className="btn btn--primary btn--sm" onClick={()=>fileRef.current.click()} disabled={lendo}>{lendo?'⏳ Lendo PDF...':'+ Adicionar livro (PDF)'}</button>
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:14}}>
            {Object.values(SESI_LIVROS_INDEXADOS).map(l=>(
              <div key={l.id} className="livro-index-card">
                <div style={{fontWeight:800,fontSize:13,marginBottom:3}}>✅ Base indexada: {l.nome}</div>
                <div style={{fontSize:11,color:'var(--ink-3)',marginBottom:5}}>{l.serie} • {l.capitulos.slice(0,3).join(' · ')}</div>
                <div>{l.codigos.slice(0,5).map(c=><span key={c} className="index-pill">{c}</span>)}</div>
              </div>
            ))}
          </div>
          {livros.length===0?(
            <div className="livros-vazia">
              <div style={{fontSize:48,marginBottom:12}}>📖</div>
              <div style={{fontWeight:700,marginBottom:6}}>Nenhum livro adicionado</div>
              <div style={{fontSize:14,marginBottom:16}}>A base SESI já está indexada. Importe PDFs extras para ampliar o tutor.</div>
              <button className="btn btn--primary" onClick={()=>fileRef.current.click()} disabled={lendo}>{lendo?'⏳ Lendo PDF...':'+ Adicionar primeiro livro'}</button>
              <div style={{marginTop:16,padding:'10px 14px',background:'var(--sage-pale)',border:'1px solid var(--sage)',borderRadius:12,fontSize:13,color:'var(--sage-2)'}}>
                ✅ <strong>Ativo:</strong> Base SESI indexada + leitura de PDFs importados para respostas e atividades.
              </div>
            </div>
          ):(
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {livros.map((l,i)=>(
                <div key={l.id} className="livro-card">
                  <div className="livro-spine" style={{background:cores[i%cores.length]}}/>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div>
                      <div className="livro-titulo">📘 {l.nome}</div>
                      <div className="livro-meta">{l.disciplina} {l.serie&&`• ${l.serie}`} • {l.tamanho} • {l.data}</div>
                      <div style={{fontSize:11,marginTop:3,color:l.conteudo?'var(--sage-2)':'var(--ink-3)'}}>{l.conteudo?`✅ Conteúdo extraído (${Math.round(l.conteudo.length/100)/10}k chars)`:' ⚠️ Sem texto extraído (PDF escaneado?)'}</div>
                    </div>
                    <button onClick={()=>removeLivro(l.id)} style={{background:'none',border:'none',color:'var(--ink-3)',cursor:'pointer',fontSize:16,padding:'2px 6px'}}>🗑️</button>
                  </div>
                </div>
              ))}
              <div style={{padding:'10px 14px',background:'var(--sage-pale)',border:'1px solid var(--sage)',borderRadius:12,fontSize:13,color:'var(--sage-2)',marginTop:4}}>
                ✅ <strong>Ativo:</strong> Tutor local usando base SESI indexada e PDFs importados salvos no navegador.
              </div>
            </div>
          )}
        </div>

        {/* Tutor IA */}
        <div>
          <div className="tutor-ia-box">
            <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:14}}>
              <Mascot size={56} mood="happy"/>
              <div>
                <div style={{fontFamily:'Space Grotesk',fontWeight:800,fontSize:16,color:'var(--plum-2)'}}>🤖 Tutor IA</div>
                <div style={{fontSize:13,color:'var(--ink-3)'}}>Pergunte qualquer coisa de matemática!</div><div className="tutor-status"><span>📚 Base SESI indexada</span><span>📄 PDFs importáveis</span><span>🌐 Busca na internet</span><span>🧠 Contexto por conversa</span></div>
              </div>
            </div>
            <div className="chat-livros">
              <div className="chat-livros-msgs" ref={msgsRef}>
                {chatMsg.map((m,i)=><div key={i} className={m.de==='ia'?'msg-ia':'msg-user'} style={{alignSelf:m.de==='ia'?'flex-start':'flex-end'}}>{m.txt}</div>)}
                {carregando&&<div className="msg-ia" style={{color:'var(--ink-3)',fontStyle:'italic'}}>⏳ Pensando...</div>}
              </div>
              <div className="chat-livros-input">
                <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&enviar()} placeholder="Escreva sua dúvida de matemática..." disabled={carregando}/>
                <button onClick={enviar} disabled={carregando||!input.trim()}>➤</button>
              </div>
            </div>
            <div style={{marginTop:10,display:'flex',gap:6,flexWrap:'wrap'}}>
              {[
                {txt:'O que é fração? Explique com exemplo do dia a dia',label:'🍕 O que é fração?'},
                {txt:`Como adaptar uma atividade de área para aluno com ${student?.condicao||'necessidades especiais'}?`,label:'♿ Adaptar atividade'},
                {txt:`Crie uma atividade curta de ${student?.ano||'5º ano'} baseada nos livros SESI`,label:'🎮 Criar atividade'},
                {txt:'Quais os erros mais comuns em porcentagem e como corrigir?',label:'📊 Erros comuns'},
                {txt:'Busque na internet uma curiosidade de matemática para motivar alunos',label:'🌐 Curiosidade'},
                {txt:'Quais códigos BNCC aparecem nos livros indexados?',label:'📋 Códigos BNCC'},
              ].map(q=>(
                <button key={q.txt} className="btn btn--sm" style={{fontSize:12,padding:'5px 10px'}} onClick={()=>{setInput(q.txt);}}>{q.label}</button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

const CONDITIONS_LIST=[
  {value:'',label:'Sem condição identificada',emoji:'👤'},
  {value:'TEA – Transtorno do Espectro Autista',label:'TEA – Autismo',emoji:'🌟'},
  {value:'TDAH',label:'TDAH',emoji:'⚡'},
  {value:'Síndrome de Down',label:'Síndrome de Down',emoji:'🎉'},
  {value:'Paralisia Cerebral',label:'Paralisia Cerebral',emoji:'✨'},
  {value:'Deficiência Intelectual',label:'Deficiência Intelectual',emoji:'💡'},
  {value:'Deficiência Visual',label:'Deficiência Visual',emoji:'👁️'},
  {value:'Deficiência Auditiva',label:'Deficiência Auditiva',emoji:'👂'},
  {value:'Outra',label:'Outra condição',emoji:'📋'},
];
const SERIES_LIST=['1º Ano – Ensino Fundamental','2º Ano – Ensino Fundamental','3º Ano – Ensino Fundamental','4º Ano – Ensino Fundamental','5º Ano – Ensino Fundamental','6º Ano – Ensino Fundamental','7º Ano – Ensino Fundamental','8º Ano – Ensino Fundamental','9º Ano – Ensino Fundamental','1º Ano – Ensino Médio','2º Ano – Ensino Médio','3º Ano – Ensino Médio'];

const loadCustomStudents=()=>{try{return JSON.parse(localStorage.getItem('mmc_custom_students')||'[]')}catch{return[]}};
const saveCustomStudents=(arr)=>localStorage.setItem('mmc_custom_students',JSON.stringify(arr));

const CadastroAlunoModal=({onSave,onClose})=>{
  const [form,setForm]=useState({nome:'',ano:SERIES_LIST[0],condicao:'',apoio:'',turno:'Integral',turma:'',hab_cognitivo:'',des_cognitivo:'',foto:'',avancos:''});
  const [docs,setDocs]=useState([]);
  const [etapa,setEtapa]=useState(1); // 1=dados, 2=condição, 3=documentos, 4=confirmar
  const [saving,setSaving]=useState(false);
  const fotoRef=useRef();
  const docRef=useRef();
  const totalEtapas=4;

  const falar=(txt)=>window.__falar&&window.__falar(txt);

  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const handleFoto=async(e)=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>set('foto',ev.target.result);
    r.readAsDataURL(f);
    window.playClick&&window.playClick();
  };

  const handleDoc=async(e)=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      const tipo=f.name.toLowerCase().endsWith('.pdf')?'PDF':'Imagem';
      setDocs(d=>[...d,{nome:f.name,tipo,data:ev.target.result,tamanho:Math.round(f.size/1024)+' KB',dataEnvio:new Date().toLocaleDateString('pt-BR')}]);
      window.playSuccess&&window.playSuccess();
    };
    r.readAsDataURL(f);
    e.target.value='';
  };

  const removerDoc=(i)=>setDocs(d=>d.filter((_,idx)=>idx!==i));

  const salvar=()=>{
    if(!form.nome.trim()){falar('Por favor, escreva o nome do aluno.');return;}
    setSaving(true);
    const novoAluno={
      id:'custom_'+Date.now(),
      ...form,
      docs,
      customizado:true,
    };
    const lista=[...loadCustomStudents(),novoAluno];
    saveCustomStudents(lista);
    window.playLevel&&window.playLevel();
    setTimeout(()=>{setSaving(false);onSave(novoAluno);},600);
  };

  const btnStyle=(ativo,cor='var(--sage)')=>({
    padding:'14px 18px',borderRadius:14,border:`3px solid ${ativo?cor:'var(--border-strong)'}`,
    background:ativo?cor:'var(--surface)',color:ativo?'#fff':'var(--ink-2)',
    fontWeight:700,fontSize:14,cursor:'pointer',transition:'all .15s',
    display:'flex',alignItems:'center',gap:10,minHeight:56,width:'100%',textAlign:'left',
    boxShadow:ativo?`3px 3px 0 ${cor+'88'}`:'none',
  });

  const stepStyle=(ativa)=>({
    width:32,height:32,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',
    fontWeight:800,fontSize:14,
    background:ativa?'var(--sage)':'var(--bg-warm)',color:ativa?'#fff':'var(--ink-3)',border:`2px solid ${ativa?'var(--sage-2)':'var(--border)'}`,
  });

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:'var(--surface)',borderRadius:24,padding:0,maxWidth:560,width:'100%',maxHeight:'92vh',overflowY:'auto',border:'2.5px solid var(--ink)',boxShadow:'6px 6px 0 var(--ink)'}}>

        {/* Header */}
        <div style={{background:'var(--ink)',color:'#fff',padding:'20px 24px',borderRadius:'22px 22px 0 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontFamily:'Space Grotesk',fontWeight:800,fontSize:20}}>➕ Novo Aluno</div>
            <div style={{fontSize:12,opacity:.75,marginTop:2}}>Etapa {etapa} de {totalEtapas}</div>
          </div>
          <button onClick={onClose} aria-label="Fechar" style={{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',borderRadius:10,width:40,height:40,cursor:'pointer',fontSize:20,display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
        </div>

        {/* Barra de progresso */}
        <div style={{display:'flex',gap:4,padding:'12px 24px 0',background:'var(--bg-warm)'}}>
          {[1,2,3,4].map(n=>(
            <React.Fragment key={n}>
              <div style={stepStyle(etapa>=n)}>{etapa>n?'✓':n}</div>
              {n<4&&<div style={{flex:1,height:3,background:etapa>n?'var(--sage)':'var(--border)',borderRadius:2,alignSelf:'center',transition:'background .3s'}}/>}
            </React.Fragment>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',padding:'4px 24px 12px',background:'var(--bg-warm)',fontSize:11,color:'var(--ink-3)',fontWeight:700}}>
          <span>Dados</span><span>Condição</span><span>Documentos</span><span>Confirmar</span>
        </div>

        <div style={{padding:'20px 24px'}}>

          {/* ── ETAPA 1: Dados básicos ── */}
          {etapa===1&&(
            <div>
              <div style={{fontWeight:800,fontSize:16,marginBottom:16}}>👤 Dados do Aluno</div>

              {/* Foto */}
              <div style={{textAlign:'center',marginBottom:20}}>
                <div style={{width:100,height:100,borderRadius:'50%',margin:'0 auto 10px',border:'3px solid var(--ink)',background:'var(--amber-pale)',overflow:'hidden',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:40}} onClick={()=>fotoRef.current.click()} role="button" aria-label="Adicionar foto do aluno" tabIndex={0} onKeyDown={e=>e.key==='Enter'&&fotoRef.current.click()}>
                  {form.foto?<img src={form.foto} style={{width:'100%',height:'100%',objectFit:'cover'}} alt="Foto do aluno"/>:'📷'}
                </div>
                <input ref={fotoRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFoto}/>
                <button className="btn btn--sm btn--ghost" onClick={()=>fotoRef.current.click()} aria-label="Escolher foto">📷 {form.foto?'Trocar foto':'Adicionar foto'}</button>
              </div>

              <label style={{display:'block',marginBottom:12}}>
                <div style={{fontSize:12,fontWeight:800,color:'var(--ink-3)',marginBottom:4,letterSpacing:'.05em'}}>NOME COMPLETO *</div>
                <input value={form.nome} onChange={e=>set('nome',e.target.value)} placeholder="Nome do aluno" aria-label="Nome completo do aluno" style={{width:'100%',padding:'12px 14px',borderRadius:12,border:'2px solid var(--border)',fontSize:15,background:'var(--surface-2)'}} onFocus={()=>falar('Nome completo do aluno')}/>
              </label>

              <label style={{display:'block',marginBottom:12}}>
                <div style={{fontSize:12,fontWeight:800,color:'var(--ink-3)',marginBottom:4,letterSpacing:'.05em'}}>SÉRIE / ANO *</div>
                <select value={form.ano} onChange={e=>set('ano',e.target.value)} aria-label="Série ou ano do aluno" style={{width:'100%',padding:'12px 14px',borderRadius:12,border:'2px solid var(--border)',fontSize:15,background:'var(--surface-2)',cursor:'pointer'}}>
                  {SERIES_LIST.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              </label>

              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
                <label>
                  <div style={{fontSize:12,fontWeight:800,color:'var(--ink-3)',marginBottom:4}}>TURNO</div>
                  <select value={form.turno} onChange={e=>set('turno',e.target.value)} style={{width:'100%',padding:'12px 10px',borderRadius:12,border:'2px solid var(--border)',fontSize:14,background:'var(--surface-2)',cursor:'pointer'}}>
                    {['Manhã','Tarde','Integral','Noite'].map(t=><option key={t}>{t}</option>)}
                  </select>
                </label>
                <label>
                  <div style={{fontSize:12,fontWeight:800,color:'var(--ink-3)',marginBottom:4}}>TURMA</div>
                  <input value={form.turma} onChange={e=>set('turma',e.target.value)} placeholder="Ex: 5ºA" style={{width:'100%',padding:'12px 10px',borderRadius:12,border:'2px solid var(--border)',fontSize:14,background:'var(--surface-2)'}}/>
                </label>
              </div>

              <label style={{display:'block',marginBottom:4}}>
                <div style={{fontSize:12,fontWeight:800,color:'var(--ink-3)',marginBottom:4}}>APOIO DISPONÍVEL</div>
                <input value={form.apoio} onChange={e=>set('apoio',e.target.value)} placeholder="Ex: Estagiário Facilitador, Cuidador..." style={{width:'100%',padding:'12px 14px',borderRadius:12,border:'2px solid var(--border)',fontSize:14,background:'var(--surface-2)'}}/>
              </label>
            </div>
          )}

          {/* ── ETAPA 2: Condição / perfil ── */}
          {etapa===2&&(
            <div>
              <div style={{fontWeight:800,fontSize:16,marginBottom:6}}>🧠 Condição e Perfil</div>
              <div style={{fontSize:13,color:'var(--ink-3)',marginBottom:16}}>Toque para selecionar a condição do aluno:</div>
              <div style={{display:'grid',gap:8,marginBottom:16}}>
                {CONDITIONS_LIST.map(c=>(
                  <button key={c.value} style={btnStyle(form.condicao===c.value)} onClick={()=>{set('condicao',c.value);falar(c.label);window.playClick&&window.playClick();}} aria-label={c.label} aria-pressed={form.condicao===c.value}>
                    <span style={{fontSize:22}}>{c.emoji}</span>
                    <span>{c.label}</span>
                    {form.condicao===c.value&&<span style={{marginLeft:'auto'}}>✓</span>}
                  </button>
                ))}
              </div>
              <label style={{display:'block',marginBottom:12}}>
                <div style={{fontSize:12,fontWeight:800,color:'var(--ink-3)',marginBottom:4}}>✅ HABILIDADES E PONTOS FORTES</div>
                <textarea value={form.hab_cognitivo} onChange={e=>set('hab_cognitivo',e.target.value)} rows={3} placeholder="O que o aluno faz bem? Quais são seus pontos fortes?" style={{width:'100%',padding:'10px 12px',borderRadius:12,border:'2px solid var(--border)',fontSize:13,background:'var(--surface-2)',resize:'vertical'}}/>
              </label>
              <label style={{display:'block'}}>
                <div style={{fontSize:12,fontWeight:800,color:'var(--ink-3)',marginBottom:4}}>⚠️ NECESSIDADES E ADAPTAÇÕES</div>
                <textarea value={form.des_cognitivo} onChange={e=>set('des_cognitivo',e.target.value)} rows={3} placeholder="Quais apoios o aluno precisa? Dificuldades observadas?" style={{width:'100%',padding:'10px 12px',borderRadius:12,border:'2px solid var(--border)',fontSize:13,background:'var(--surface-2)',resize:'vertical'}}/>
              </label>
            </div>
          )}

          {/* ── ETAPA 3: Documentos / laudos ── */}
          {etapa===3&&(
            <div>
              <div style={{fontWeight:800,fontSize:16,marginBottom:6}}>📎 Documentos e Laudos</div>
              <div style={{fontSize:13,color:'var(--ink-3)',marginBottom:16}}>Adicione laudos médicos, relatórios pedagógicos ou outros documentos em PDF ou imagem:</div>

              <input ref={docRef} type="file" accept=".pdf,image/*" style={{display:'none'}} onChange={handleDoc}/>
              <button className="btn btn--primary" style={{width:'100%',justifyContent:'center',fontSize:15,marginBottom:16,padding:'16px'}} onClick={()=>{docRef.current.click();falar('Escolha um documento para enviar');}} aria-label="Adicionar documento ou laudo">
                📄 Adicionar Laudo ou Documento
              </button>

              {docs.length===0?(
                <div style={{textAlign:'center',padding:'30px 20px',background:'var(--bg-warm)',borderRadius:16,border:'2px dashed var(--border-strong)'}}>
                  <div style={{fontSize:40,marginBottom:8}}>📂</div>
                  <div style={{fontWeight:700,marginBottom:4}}>Nenhum documento ainda</div>
                  <div style={{fontSize:13,color:'var(--ink-3)'}}>Laudos em PDF, relatórios e imagens são aceitos. É opcional!</div>
                </div>
              ):(
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {docs.map((d,i)=>(
                    <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:'var(--sky-pale)',border:'2px solid var(--sky)',borderRadius:12}}>
                      <span style={{fontSize:28}}>{d.tipo==='PDF'?'📄':'🖼️'}</span>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:13,color:'var(--sky-2)'}}>{d.nome}</div>
                        <div style={{fontSize:11,color:'var(--ink-3)'}}>{d.tipo} · {d.tamanho} · {d.dataEnvio}</div>
                      </div>
                      <button onClick={()=>{removerDoc(i);window.playClick&&window.playClick();}} style={{background:'var(--coral-pale)',border:'1.5px solid var(--coral)',borderRadius:8,padding:'6px 10px',cursor:'pointer',color:'var(--coral-2)',fontWeight:700,fontSize:13}} aria-label={`Remover ${d.nome}`}>🗑️</button>
                    </div>
                  ))}
                </div>
              )}

              <div style={{marginTop:16}}>
                <div style={{fontSize:12,fontWeight:800,color:'var(--ink-3)',marginBottom:4}}>🌟 AVANÇOS E OBSERVAÇÕES GERAIS</div>
                <textarea value={form.avancos} onChange={e=>set('avancos',e.target.value)} rows={3} placeholder="Progressos observados, conquistas, notas importantes..." style={{width:'100%',padding:'10px 12px',borderRadius:12,border:'2px solid var(--border)',fontSize:13,background:'var(--surface-2)',resize:'vertical'}}/>
              </div>
            </div>
          )}

          {/* ── ETAPA 4: Confirmar ── */}
          {etapa===4&&(
            <div>
              <div style={{fontWeight:800,fontSize:16,marginBottom:16}}>✅ Confirmar Cadastro</div>
              <div style={{background:'var(--sage-pale)',border:'2px solid var(--sage)',borderRadius:16,padding:16,marginBottom:16}}>
                <div style={{display:'flex',gap:14,alignItems:'center',marginBottom:14}}>
                  {form.foto?<img src={form.foto} style={{width:72,height:72,borderRadius:'50%',objectFit:'cover',border:'2.5px solid var(--ink)'}} alt=""/>:<div style={{width:72,height:72,borderRadius:'50%',background:'var(--amber-pale)',border:'2.5px solid var(--ink)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:30}}>👤</div>}
                  <div>
                    <div style={{fontWeight:800,fontSize:16}}>{form.nome||'(sem nome)'}</div>
                    <div style={{color:'var(--ink-3)',fontSize:13}}>{form.ano}</div>
                    {form.condicao&&<span className="student-cond" style={{marginTop:4,display:'inline-block'}}>{form.condicao}</span>}
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:12,color:'var(--ink-2)'}}>
                  <div>📅 Turno: <strong>{form.turno}</strong></div>
                  <div>🏫 Turma: <strong>{form.turma||'—'}</strong></div>
                  <div>🤝 Apoio: <strong>{form.apoio||'—'}</strong></div>
                  <div>📎 Docs: <strong>{docs.length} arquivo(s)</strong></div>
                </div>
              </div>
              {docs.length>0&&(
                <div style={{marginBottom:16}}>
                  <div style={{fontSize:12,fontWeight:800,color:'var(--ink-3)',marginBottom:6}}>DOCUMENTOS ANEXADOS</div>
                  {docs.map((d,i)=><div key={i} style={{fontSize:13,padding:'6px 10px',background:'var(--sky-pale)',borderRadius:8,marginBottom:4,color:'var(--sky-2)'}}>📄 {d.nome} ({d.tamanho})</div>)}
                </div>
              )}
              <div style={{background:'var(--amber-pale)',border:'2px dashed var(--amber)',borderRadius:12,padding:12,fontSize:13,color:'var(--amber-2)',marginBottom:4}}>
                💾 O perfil será salvo localmente neste dispositivo e ficará disponível imediatamente na lista da turma.
              </div>
            </div>
          )}

          {/* Botões de navegação */}
          <div style={{display:'flex',gap:10,marginTop:20}}>
            {etapa>1&&(
              <button className="btn btn--ghost" onClick={()=>{setEtapa(e=>e-1);falar('Voltando');}} style={{flex:1,justifyContent:'center'}} aria-label="Voltar etapa">← Voltar</button>
            )}
            {etapa<totalEtapas?(
              <button className="btn btn--primary" onClick={()=>{if(etapa===1&&!form.nome.trim()){falar('Por favor, escreva o nome do aluno');return;}setEtapa(e=>e+1);falar('Próxima etapa');window.playClick&&window.playClick();}} style={{flex:2,justifyContent:'center',fontSize:15,padding:'14px'}} aria-label="Próxima etapa">Próximo →</button>
            ):(
              <button className="btn btn--primary" onClick={salvar} disabled={saving} style={{flex:2,justifyContent:'center',fontSize:15,padding:'14px',background:saving?'var(--sage-2)':'var(--sage)'}} aria-label="Salvar cadastro do aluno">
                {saving?'💾 Salvando...':'✅ Cadastrar Aluno'}
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

// ════════════════════════════════════
//  APP PRINCIPAL
// ════════════════════════════════════
const loadState=()=>{try{return JSON.parse(localStorage.getItem('mmc_v3')||'{}')}catch{return{}}};
const saveState=(s)=>localStorage.setItem('mmc_v3',JSON.stringify(s));

const App=()=>{
  const [tela,setTela]=useState('selecao');
  const [student,setStudent]=useState(null);
  const [tab,setTab]=useState('jogos');
  const [state,setState]=useState(loadState);
  const [selectedSerie,setSelectedSerie]=useState('6');
  const [activeFase,setActiveFase]=useState(null);
  const [tutorialKey,setTutorialKey]=useState(null);
  const [confetti,setConfetti]=useState(false);
  const [soundOn,setSoundOn]=useState(localStorage.getItem('mmc_sound')!=='off');
  const [voiceOn,setVoiceOn]=useState(localStorage.getItem('mmc_voice')==='on');
  const [volume,setVolume]=useState(parseFloat(localStorage.getItem('mmc_vol')||'0.9'));
  const [notas,setNotas]=useState(()=>{try{return JSON.parse(localStorage.getItem('mmc_notas')||'{}')}catch{return{}}});
  const [savedFlash,setSavedFlash]=useState(false);
  const [filtroSerie,setFiltroSerie]=useState('todos');
  const [customStudents,setCustomStudents]=useState(loadCustomStudents);
  const [showCadastro,setShowCadastro]=useState(false);
  const allStudents=[...STUDENTS_DATA,...customStudents];
  useEffect(()=>{window.__currentStudentId=student?.id||'geral';},[student]);
  useEffect(()=>{
    if(tela==='boas-vindas'&&student){
      const p=getPersona(student);
      window.__voiceRate=p.taxa;
      window.playWelcome&&window.playWelcome();
      setTimeout(()=>window.__falar(getMsgBV(student)),900);
    }
    if(tela==='app'&&tab==='jogos'){
      const nome=student?.nome?.split(' ')[0]||'';
      setTimeout(()=>window.__falar(getMsgGuia('jogos',nome)),400);
    }
  },[tela,tab]);

  useEffect(()=>{window.__soundsOn=soundOn;localStorage.setItem('mmc_sound',soundOn?'on':'off');},[soundOn]);
  useEffect(()=>{window.__voiceOn=voiceOn;localStorage.setItem('mmc_voice',voiceOn?'on':'off');if(voiceOn)window.__falar('Voz ativada!');else window.__pararVoz&&window.__pararVoz();},[voiceOn]);
  useEffect(()=>{window.__volume=volume;localStorage.setItem('mmc_vol',volume);},[volume]);
  useEffect(()=>{saveState(state);},[state]);
  useEffect(()=>{localStorage.setItem('mmc_notas',JSON.stringify(notas));},[notas]);
  useEffect(()=>{
    if(activeFase?.obj){
      const nome=student?.nome?.split(' ')[0]||'';
      window.__falar(`${nome}! ${activeFase.label}. Objetivo: ${activeFase.obj}`);
    }
  },[activeFase?.key]);
  useEffect(()=>{if(student){setSelectedSerie(getSerieKey(student.ano));setTab('jogos');}},[student]);

  const xp=state.xp||0,level=state.level||1;
  const progresso=state.progresso||{};

  const addXP=(pts)=>{
    setState(s=>{const nx=(s.xp||0)+pts,nl=Math.floor(nx/100)+1;
      const levelUp=nl>(s.level||1);
      if(levelUp)setTimeout(()=>{window.playLevel&&window.playLevel();},200);
      return{...s,xp:nx,level:nl};
    });
    setConfetti(true);setTimeout(()=>setConfetti(false),2500);
  };

  const setProgresso=(key,done)=>setState(s=>({...s,progresso:{...(s.progresso||{}),[key]:done}}));
  const notaAtual=student?(notas[student.id]||{}):{};
  const saveNota=(tipo,val)=>{
    if(!student)return;
    setNotas(n=>({...n,[student.id]:{...(n[student.id]||{}),[tipo]:val}}));
    setSavedFlash(true);setTimeout(()=>setSavedFlash(false),2000);
  };

  const availableSeries=student?getAllLowerSeries(getSerieKey(student.ano)):['6'];
  const fases=FASES_POR_SERIE[selectedSerie]||[];

  // Filtro turma
  const series_unicas=[...new Set(allStudents.map(s=>s.ano))].sort();
  const alunosFiltrados=filtroSerie==='todos'?allStudents:allStudents.filter(s=>s.ano===filtroSerie);

  // Mapa de fases (snake path)
  const FASES_POR_LINHA=4;
  const MapaFases=()=>{
    const mundo=MUNDO_CONFIG[selectedSerie]||{label:'Mundo',emoji:'🎮',cor:'var(--sage)',bg:'var(--sage-pale)',shadow:'var(--sage-2)'};
    const totalFases=fases.length;
    const feitasCount=fases.filter(f=>!!progresso[f.key]).length;
    const progPct=totalFases?Math.round((feitasCount/totalFases)*100):0;
    // Divide em linhas de FASES_POR_LINHA
    const linhas=[];
    for(let i=0;i<fases.length;i+=FASES_POR_LINHA)linhas.push(fases.slice(i,i+FASES_POR_LINHA));
    const FaseCirculo=({fase})=>{
      const tc=TIPO_CONFIG[fase.tipo];
      const done=!!progresso[fase.key];
      const isActive=activeFase?.key===fase.key;
      const tipoDot={tutorial:'💡',jogo:'🎮',desafio:'⚔️',missao:'🚀'}[fase.tipo]||'●';
      return(
        <div className="fase-item">
          <div className={`fase-circulo${done?' done':isActive?' active':fase.locked?' locked':''}`}
            style={{background:done?tc.bg:isActive?tc.bg:'var(--surface)',borderColor:done?tc.cor:isActive?tc.cor:'var(--ink)'}}
            onClick={()=>{
              if(fase.locked)return;
              window.playClick();
              if(fase.tipo==='tutorial'){setTutorialKey(fase.tutKey||'fracao');setActiveFase(fase);}
              else if(fase.tutKey&&!progresso[fase.key+'_tut_visto']){setTutorialKey(fase.tutKey);setActiveFase(fase);}
              else setActiveFase(fase);
            }}>
            <span style={{fontSize:24}}>{fase.emoji}</span>
            {done&&<div style={{position:'absolute',top:-4,right:-4,width:20,height:20,borderRadius:'50%',background:'var(--sage)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,border:'2px solid white'}}>✓</div>}
            <div className="fase-tipo-dot" style={{background:tc.cor}}>{tipoDot}</div>
          </div>
          <div className="fase-stars">{done?'⭐':isActive?'▶':'○'}</div>
          <div className="fase-label">{fase.label}</div>
          {!done&&<div className="fase-xp-hint">+XP</div>}
        </div>
      );
    };
    return(
      <div>
        {/* Seletor de série */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:800,color:'var(--ink-3)',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:8}}>
            Escolher série {student&&<span style={{color:'var(--sage-2)',fontWeight:400}}> ✦ atual: {student.ano}</span>}
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {availableSeries.map(k=>(
              <button key={k} onClick={()=>{setSelectedSerie(k);setActiveFase(null);window.playClick();}}
                style={{padding:'6px 14px',borderRadius:999,border:`2px solid ${selectedSerie===k?'var(--sage-2)':'var(--border-strong)'}`,background:selectedSerie===k?'var(--sage)':'var(--surface)',color:selectedSerie===k?'#fff':'var(--ink-2)',font:'700 13px/1 "Atkinson Hyperlegible",sans-serif',cursor:'pointer',transition:'all .12s'}}>
                {SERIE_LABELS[k]}
              </button>
            ))}
          </div>
        </div>
        {/* Banner do mundo */}
        <div className="mundo-banner" style={{background:mundo.bg,borderColor:mundo.shadow,boxShadow:`3px 3px 0 ${mundo.shadow}`}}>
          <div className="mundo-banner__emoji">{mundo.emoji}</div>
          <div className="mundo-banner__info">
            <div className="mundo-banner__title" style={{color:mundo.shadow}}>{mundo.label}</div>
            <div className="mundo-banner__prog">{feitasCount} de {totalFases} fases concluídas · {progPct}% completo</div>
            <div className="mundo-prog-bar"><div className="mundo-prog-fill" style={{width:`${progPct}%`,background:mundo.cor}}/></div>
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
            {Object.entries(TIPO_CONFIG).map(([k,v])=>(
              <div key={k} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--ink-3)'}}>
                <div style={{width:10,height:10,borderRadius:'50%',background:v.cor}}/>{v.emoji}
              </div>
            ))}
          </div>
        </div>
        {/* Snake path */}
        <div className="mapa-mundo">
          {linhas.map((linha,li)=>{
            const rtl=li%2===1;
            const linhaOrdenada=rtl?[...linha].reverse():linha;
            return(
              <div key={li}>
                <div className={`mapa-snake-row${rtl?' mapa-snake-row--rtl':''}`}>
                  {linhaOrdenada.map((fase,fi)=>{
                    const faseReal=rtl?linha[linha.length-1-fi]:fase;
                    const isLastInRow=fi===linhaOrdenada.length-1;
                    const faseDone=!!progresso[faseReal.key];
                    const nextFaseDone=fi<linhaOrdenada.length-1&&!!progresso[linhaOrdenada[fi+1]?.key];
                    return(
                      <React.Fragment key={faseReal.key}>
                        <FaseCirculo fase={faseReal}/>
                        {!isLastInRow&&<div className={`mapa-h-connector${faseDone&&nextFaseDone?' done':''}`}/>}
                      </React.Fragment>
                    );
                  })}
                </div>
                {li<linhas.length-1&&(()=>{
                  const lastFaseThisRow=rtl?linha[0]:linha[linha.length-1];
                  const firstFaseNextRow=linhas[li+1]?.[rtl?linhas[li+1].length-1:0];
                  const connDone=!!progresso[lastFaseThisRow?.key]&&!!progresso[firstFaseNextRow?.key];
                  const connLeft=rtl?'calc(100% - 44px)':'36px';
                  return <div style={{position:'relative',height:28,marginBottom:4}}>
                    <div className={`mapa-v-connector${connDone?' done':''}`} style={{width:3,height:28,position:'absolute',left:connLeft}}/>
                  </div>;
                })()}
              </div>
            );
          })}
        </div>
        {/* ← jogo ativo agora renderizado fora do MapaFases */}
      </div>
    );
  };

  // ─── TELA SELEÇÃO ───
  if(tela==='selecao')return(
    <div className="tela-selecao">
      {showCadastro&&<CadastroAlunoModal onSave={novoAluno=>{const lista=[...customStudents,novoAluno];setCustomStudents(lista);setShowCadastro(false);window.__falar&&window.__falar('Aluno cadastrado! '+novoAluno.nome.split(' ')[0]+' aparece agora na lista.');}} onClose={()=>setShowCadastro(false)}/>}
      <Confetti active={confetti}/>
      <div className="selecao-header">
        <img src={LOGO_SESI} alt="SESI" style={{height:48,marginBottom:14}}/>
        <h1>Matemática Inclusiva</h1>
        <p>SESI Diadema · Quem vai jogar hoje?</p>
      </div>
      {/* Busca */}
      <div className="selecao-search">
        <span style={{fontSize:18}}>🔍</span>
        <input placeholder="Buscar aluno pelo nome..." value={filtroSerie==='busca'?'':''} onChange={e=>{setFiltroSerie('busca');window.__busca=e.target.value;}} onInput={e=>{window.__busca=e.target.value;}}/>
      </div>
      {/* Filtro por série */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'center',marginBottom:20,maxWidth:960}}>
        <button onClick={()=>{setFiltroSerie('todos');window.__busca='';}} style={{padding:'5px 14px',borderRadius:999,border:`2px solid ${filtroSerie==='todos'?'var(--sage-2)':'var(--border-strong)'}`,background:filtroSerie==='todos'?'var(--sage)':'white',color:filtroSerie==='todos'?'#fff':'var(--ink-2)',font:'700 12px/1 inherit',cursor:'pointer'}}>Todos</button>
        {series_unicas.map(s=>(
          <button key={s} onClick={()=>{setFiltroSerie(s);window.__busca='';}} style={{padding:'5px 14px',borderRadius:999,border:`2px solid ${filtroSerie===s?'var(--sage-2)':'var(--border-strong)'}`,background:filtroSerie===s?'var(--sage)':'white',color:filtroSerie===s?'#fff':'var(--ink-2)',font:'700 12px/1 inherit',cursor:'pointer'}}>
            {s.split(' – ')[0]}
          </button>
        ))}
      </div>
      <div className="alunos-grid">
        {/* Card para adicionar novo aluno */}
        <div className="aluno-card" style={{border:'3px dashed var(--sage)',background:'var(--sage-pale)',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:160}} onClick={()=>{setShowCadastro(true);window.playClick&&window.playClick();window.__falar&&window.__falar('Cadastrar novo aluno');}} role="button" aria-label="Cadastrar novo aluno" tabIndex={0} onKeyDown={e=>e.key==='Enter'&&setShowCadastro(true)}>
          <div style={{fontSize:40,marginBottom:8}}>➕</div>
          <div style={{fontWeight:800,fontSize:13,color:'var(--sage-2)'}}>Novo Aluno</div>
          <div style={{fontSize:11,color:'var(--sage)',marginTop:2}}>Cadastrar perfil</div>
        </div>
        {alunosFiltrados.map(s=>{
          const totalFasesAluno=Object.keys(FASES_POR_SERIE).reduce((acc,k)=>{if(parseInt(k)<=(parseInt(getSerieKey(s.ano))||99))return acc+(FASES_POR_SERIE[k]?.length||0);return acc;},0);
          const feitasAluno=Object.keys(state.progresso||{}).length;
          const pct=totalFasesAluno?Math.min(100,Math.round((feitasAluno/totalFasesAluno)*100)):0;
          return(
            <div key={s.id} className="aluno-card" onClick={()=>{setStudent(s);setTela('boas-vindas');window.playSuccess&&window.playSuccess();}}>
              {s.foto?<img src={s.foto} className="aluno-foto" alt={s.nome}/>:<div className="aluno-foto-placeholder">👤</div>}
              <div className="aluno-nome">{s.nome.split(' ').slice(0,2).join(' ')}</div>
              <span className="aluno-serie">{(s.ano||'').split(' – ')[0]}</span>
              {s.condicao&&<div className="aluno-cond-tag">{s.condicao.split('–')[0].trim()}</div>}
              <div className="aluno-prog"><div className="aluno-prog-fill" style={{width:`${pct}%`}}/></div>
            </div>
          );
        })}
      </div>
    </div>
  );

  if(tela==='boas-vindas')return(
    <div className="tela-bv">
      <Confetti active={confetti}/>
      {student?.foto
        ?<img src={student.foto} className="bv-foto" alt={student.nome}/>
        :<div style={{fontSize:90,marginBottom:14,animation:'pop-in .5s ease'}}>👤</div>}
      <div style={{fontFamily:'Space Grotesk',fontSize:30,fontWeight:800,marginBottom:2}}>{student?.nome?.split(' ')[0]}!</div>
      <div style={{fontSize:14,color:'var(--ink-3)',marginBottom:24}}>{student?.ano}{student?.condicao?` · ${student.condicao.split('–')[0].trim()}`:''}</div>
      <MascotFala msg={getMsgBV(student)} mood="happy" onOuvir={()=>window.__falar(getMsgBV(student))}/>
      <div style={{height:28}}/>
      <button className="btn-jogar" onClick={()=>{setTela('app');setTab('jogos');}}>
        {getPersona(student).emoji} Vamos Jogar!
      </button>
      <button className="btn btn--ghost btn--sm" style={{marginTop:14}} onClick={()=>setTela('selecao')}>← Não sou eu</button>
    </div>
  );

  // ─── TOPBAR ───
  const Topbar=()=>(
    <div className="topbar">
      <div className="topbar__inner">
        <div className="sesi-brand">
          <img src={LOGO_SESI} alt="SESI" className="sesi-logo"/>
          <div className="sesi-divider"/>
          <div className="brand">
            <div className="brand__mark">π</div>
            <div><div className="brand__title">Matemática Inclusiva Super Fases</div></div>
          </div>
        </div>

        {/* Player mini */}
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'5px 12px',background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:999}}>
          {student?.foto?<img src={student.foto} style={{width:26,height:26,borderRadius:'50%',objectFit:'cover',objectPosition:'top',border:'1.5px solid var(--ink)'}} alt=""/>:<span style={{fontSize:18}}>🦊</span>}
          <span style={{fontWeight:700,fontSize:13,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{student?.nome?.split(' ')[0]||'Jogador'}</span>
          <span className="xp-pill" style={{padding:'2px 8px',fontSize:11}}><span className="xp-pill__dot"/>{xp} XP</span>
        </div>

        <div style={{display:'flex',gap:6,alignItems:'center',marginLeft:'auto',flexWrap:'wrap'}}>
          {/* Controle de voz */}
          <div style={{display:'flex',alignItems:'center',gap:6,background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:999,padding:'4px 10px'}}>
            <button title={voiceOn?'Desligar voz':'Ligar voz'} onClick={()=>setVoiceOn(v=>!v)} style={{background:'none',border:'none',cursor:'pointer',fontSize:16,padding:0,lineHeight:1}}>{voiceOn?'🗣️':'🔕'}</button>
            <input type="range" min="0" max="1" step="0.05" value={volume} onChange={e=>setVolume(parseFloat(e.target.value))}
              title="Volume da voz"
              style={{width:52,height:4,accentColor:'var(--plum)',cursor:'pointer'}}/>
            <button title={soundOn?'Efeitos OFF':'Efeitos ON'} onClick={()=>setSoundOn(v=>!v)} style={{background:'none',border:'none',cursor:'pointer',fontSize:15,padding:0,lineHeight:1}}>{soundOn?'🔊':'🔇'}</button>
          </div>
          <button className="btn btn--ghost btn--sm" onClick={()=>{setTela('selecao');setActiveFase(null);}}>← Trocar aluno</button>
        </div>

        <div className="tabs">
          {[{id:'jogos',label:'🎮 Jogos'},{id:'perfil',label:'👤 Perfil'},{id:'turma',label:'🏫 Turma'},{id:'livros',label:'📚 Livros'},{id:'diagnostico',label:'📊 Diagnóstico'},{id:'registros',label:'📝 Registros'}].map(t=>(
            <button key={t.id} className={`tab${tab===t.id?' tab--active':''}`} onClick={()=>{setTab(t.id);window.__falar(getMsgGuia(t.id,student?.nome?.split(' ')[0]||''));}}>{t.label}</button>
          ))}
        </div>
      </div>
    </div>
  );

  // ─── TELA APP ───
  return(
    <div>
      <Confetti active={confetti}/>
      {tutorialKey&&<TutorialModal tutKey={tutorialKey} onFechar={()=>setTutorialKey(null)} onComecar={()=>{setTutorialKey(null);if(activeFase?.tipo==='tutorial'){setProgresso(activeFase.key,true);}}}/>}

      <Topbar/>
      {/* ── GUIA MASCOTE ── */}
      <div className="guia-bar">
        <Mascot size={34} mood="happy"/>
        <span className="guia-texto">{getMsgGuia(tab,student?.nome?.split(' ')[0]||'')}</span>
        <button onClick={()=>window.__falar(getMsgGuia(tab,student?.nome?.split(' ')[0]||''))} title="Ouvir dica" style={{background:'none',border:'none',cursor:'pointer',fontSize:20,lineHeight:1,padding:0}}>🔊</button>
      </div>
      <div className="shell">

        {/* ── ABA JOGOS ── */}
        {tab==='jogos'&&(
          <div>
            {/* ── JOGO ATIVO → tela cheia, mapa some ── */}
            {activeFase&&activeFase.comp?(
              <div style={{animation:'float-in .3s ease'}}>
                {/* Badge do aluno sempre visível */}
                <div className="student-badge-jogo">
                  {student?.foto
                    ?<img src={student.foto} className="student-badge-foto" alt={student.nome}/>
                    :<div className="student-badge-avatar">👤</div>}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:800,fontSize:15,lineHeight:1.1}}>{student?.nome?.split(' ').slice(0,2).join(' ')}</div>
                    <div style={{fontSize:11,color:'var(--ink-3)',marginTop:1}}>{activeFase.emoji} {activeFase.label}</div>
                    {activeFase.cod&&<div style={{fontSize:10,color:'var(--plum-2)',fontWeight:700,marginTop:2}}>📋 {activeFase.cod}</div>}
                  </div>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3}}>
                    <span className="xp-pill" style={{fontSize:11}}><span className="xp-pill__dot"/>{xp} XP</span>
                    <span className="level-pill" style={{fontSize:10,padding:'2px 8px'}}><span className="level-pill__num" style={{fontSize:10}}>{level}</span>Nível {level}</span>
                  </div>

                  <div className="sticker--soft">
                    <h4 style={{margin:'0 0 10px',fontSize:14}}>📊 Sessão atual</h4>
                    <div style={{fontSize:14,color:'var(--ink-2)',lineHeight:1.8}}>
                      <div>⭐ {xp} XP acumulados</div>
                      <div>🏆 {Object.keys(progresso).length} fases concluídas</div>
                      <div>📈 Nível {level}</div>
                      <div>🎯 Série: {selectedSerie&&SERIE_LABELS[selectedSerie]}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
