<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<title>Matemática Inclusiva Super Fases — SESI Diadema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>

:root {
  --bg:#F2EDDD; --bg-warm:#EAE3CE; --surface:#FFFCF4; --surface-2:#F8F2DF;
  --border:#DCD2B8; --border-strong:#B8AC8A; --ink-line:#C9BEA5;
  --ink:#2A2A28; --ink-2:#4A4842; --ink-3:#807C71; --ink-soft:#B0A99A;
  --sage:#4F9968; --sage-2:#3B7A4F; --sage-soft:#D2EBD6; --sage-pale:#E7F4E8;
  --coral:#E96B4F; --coral-2:#C44A2C; --coral-soft:#FBD6C8; --coral-pale:#FCEBE2;
  --amber:#E8AE2E; --amber-2:#C18A1E; --amber-soft:#F8E29A; --amber-pale:#FCF3D5;
  --sky:#4A82B4; --sky-2:#356593; --sky-soft:#CCE0EF; --sky-pale:#E9F1F7;
  --plum:#7E5CC4; --plum-2:#5F3FA8; --plum-soft:#DCCFF1; --plum-pale:#ECE4F7;
  --hot:#E84A8A; --hot-soft:#FBD2E1;
  --mint:#38C39A; --mint-soft:#C6EEDC;
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --shadow-sm:0 1px 0 rgba(60,50,30,.04),0 1px 2px rgba(60,50,30,.06);
  --shadow-md:0 1px 0 rgba(60,50,30,.04),0 4px 14px rgba(60,50,30,.08);
  --shadow-lg:0 8px 32px rgba(60,50,30,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:radial-gradient(circle at 12% 8%,rgba(232,174,46,.08) 0%,transparent 40%),
             radial-gradient(circle at 88% 92%,rgba(126,92,196,.08) 0%,transparent 40%),var(--bg);
  color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
}
h1,h2,h3,h4{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:50;background:rgba(246,241,230,.88);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar__inner{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand__mark{width:36px;height:36px;border-radius:10px;background:var(--sage);color:#fff;
  display:grid;place-items:center;font-size:18px;flex-shrink:0}
.brand__title{font-size:17px;line-height:1.1}
.brand__sub{font-size:12px;color:var(--ink-3);font-weight:500}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;color:var(--ink-2);padding:7px 13px;
  border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;transition:all .15s}
.tab:hover{background:var(--bg-warm);color:var(--ink)}
.tab--active{background:var(--ink);color:#fff}
.tab--active:hover{background:var(--ink);color:#fff}

/* ── SHELL ── */
.shell{max-width:1200px;margin:0 auto;padding:28px 24px 100px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:var(--r-md);
  font-weight:700;font-size:15px;transition:all .12s;border:2px solid var(--ink);background:var(--surface);
  color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn--primary{background:var(--sage);color:#fff;border-color:var(--sage-2);box-shadow:3px 3px 0 var(--sage-2)}
.btn--primary:hover{background:var(--sage-2);box-shadow:4px 4px 0 var(--sage-2)}
.btn--coral{background:var(--coral);color:#fff;border-color:var(--coral-2);box-shadow:3px 3px 0 var(--coral-2)}
.btn--amber{background:var(--amber);color:var(--ink);border-color:var(--amber-2);box-shadow:3px 3px 0 var(--amber-2)}
.btn--plum{background:var(--plum);color:#fff;border-color:var(--plum-2);box-shadow:3px 3px 0 var(--plum-2)}
.btn--sm{padding:7px 14px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn--sm:hover{box-shadow:3px 3px 0 var(--ink)}
.btn--sm:active{box-shadow:1px 1px 0 var(--ink)}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--border-strong);box-shadow:3px 3px 0 var(--border-strong)}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);
  padding:24px;box-shadow:var(--shadow-md)}
.sticker{background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-xl);
  padding:24px;box-shadow:4px 4px 0 var(--ink);position:relative}
.sticker--soft{background:var(--surface);border:2px solid var(--border-strong);border-radius:var(--r-xl);
  padding:24px;box-shadow:3px 3px 0 var(--border-strong)}

/* ── TAPE ── */
.tape{display:block;position:absolute;width:44px;height:14px;border-radius:3px;opacity:.85}
.tape--top-left{top:-7px;left:20px;transform:rotate(-3deg)}
.tape--top-right{top:-7px;right:24px;transform:rotate(2deg)}
.tape--top-center{top:-7px;left:50%;transform:translateX(-50%) rotate(-1deg)}
.tape--coral{background:var(--coral-soft)}
.tape--sage{background:var(--sage-soft)}
.tape--amber{background:var(--amber-soft)}
.tape--sky{background:var(--sky-soft)}

/* ── SECTION HEAD ── */
.section-head{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.section-head__num{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;flex-shrink:0}
.section-head h2{font-size:28px;font-weight:800}
.section-head__sub{font-size:14px;color:var(--ink-3);margin-top:2px}

/* ── PILLS ── */
.level-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;
  border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}
.level-pill__num{width:24px;height:24px;border-radius:50%;background:var(--hot);
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.xp-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;
  border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface);
  font-size:13px;font-weight:700;color:var(--ink-2)}
.xp-pill__dot{width:8px;height:8px;border-radius:50%;background:var(--hot)}

/* ── XP BAR ── */
.xp-bar{height:6px;background:var(--bg-warm);border-radius:999px;overflow:hidden;margin-top:4px}
.xp-bar__fill{height:100%;background:linear-gradient(90deg,var(--hot),var(--plum));
  border-radius:999px;transition:width .5s ease}

/* ── GRIDS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.spacer-12{height:12px}
.spacer-20{height:20px}
@media(max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ── FOTO ALUNO ── */
.student-photo{width:100px;height:100px;border-radius:50%;object-fit:cover;
  object-position:top;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.student-photo-lg{width:140px;height:140px;border-radius:50%;object-fit:cover;
  object-position:top;border:3.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.photo-placeholder{width:100px;height:100px;border-radius:50%;background:var(--amber-pale);
  border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:40px}

/* ── MASCOT ANIMADO ── */
@keyframes mascot-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes mascot-celebrate{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.1)}75%{transform:rotate(10deg) scale(1.1)}}
@keyframes mascot-think{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg) translateX(3px)}}
.mascot--bounce{animation:mascot-bounce 1.8s ease-in-out infinite}
.mascot--celebrate{animation:mascot-celebrate .5s ease-in-out}
.mascot--think{animation:mascot-think 2s ease-in-out infinite}

/* ── FEEDBACK ANIMATIONS ── */
@keyframes pop-in{0%{transform:scale(.5) rotate(-5deg);opacity:0}60%{transform:scale(1.15) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes slide-up{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@keyframes star-fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(80px) rotate(360deg);opacity:0}}
@keyframes xp-float{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.anim-pop{animation:pop-in .4s ease forwards}
.anim-shake{animation:shake .4s ease}
.anim-slide{animation:slide-up .3s ease forwards}
.anim-xp-float{animation:xp-float 1.2s ease forwards;position:absolute;font-family:'Space Grotesk';font-weight:800;color:var(--hot);font-size:22px;pointer-events:none;z-index:20}

/* ── CONFETTI ── */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
@keyframes confetti-fall{0%{transform:translateY(-10px) rotate(0) scaleX(1)}50%{scaleX(-1)}100%{transform:translateY(100vh) rotate(720deg) scaleX(1)}}

/* ── GAME CONTAINER ── */
.game-card{background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-xl);
  padding:24px;box-shadow:4px 4px 0 var(--ink);position:relative;overflow:hidden}
.game-enunciado{padding:14px 18px;background:var(--amber-pale);border:2px dashed var(--amber);
  border-radius:var(--r-md);margin-bottom:16px;font-weight:700;font-size:16px;line-height:1.5}
.game-opcoes{display:grid;gap:10px}
.game-opcoes--2col{grid-template-columns:1fr 1fr}
.opcao{padding:14px 18px;border:2.5px solid var(--ink);border-radius:var(--r-md);background:var(--surface);
  font-weight:700;font-size:15px;cursor:pointer;transition:all .12s;text-align:center;
  box-shadow:2px 2px 0 var(--ink)}
.opcao:hover{background:var(--surface-2);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.opcao:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.opcao--certa{background:var(--sage-pale)!important;border-color:var(--sage-2)!important;color:var(--sage-2);box-shadow:2px 2px 0 var(--sage-2)!important}
.opcao--errada{background:var(--coral-pale)!important;border-color:var(--coral-2)!important;color:var(--coral-2);box-shadow:2px 2px 0 var(--coral-2)!important}
.opcao:disabled{cursor:default}

/* ── FEEDBACK BOX ── */
.feedback-box{padding:14px 18px;border-radius:var(--r-md);margin-top:14px;font-size:15px;
  border-left:4px solid;animation:slide-up .3s ease}
.feedback-box--ok{background:var(--sage-pale);border-color:var(--sage);color:var(--sage-2)}
.feedback-box--ko{background:var(--coral-pale);border-color:var(--coral);color:var(--coral-2)}

/* ── PROGRESS DOTS ── */
.progress-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--bg-warm);border:1.5px solid var(--border-strong);transition:all .2s}
.pdot--done{background:var(--sage);border-color:var(--sage-2)}
.pdot--now{background:var(--amber);border-color:var(--amber-2);transform:scale(1.3)}

/* ── REFORÇO POSITIVO ── */
.refuerzo{position:fixed;bottom:24px;right:24px;z-index:900;max-width:300px}
.refuerzo__card{background:var(--surface);border:2.5px solid var(--sage-2);border-radius:var(--r-lg);
  padding:16px 20px;box-shadow:4px 4px 0 var(--sage-2);animation:pop-in .4s ease;display:flex;gap:12px;align-items:center}
.refuerzo__msg{font-weight:700;font-size:15px;color:var(--sage-2)}
.refuerzo__xp{font-family:'Space Grotesk';font-weight:800;font-size:24px;color:var(--hot)}

/* ── STUDENT LIST ── */
.student-item{display:flex;align-items:center;gap:12px;padding:10px 12px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
  cursor:pointer;transition:all .12s;margin-bottom:6px}
.student-item:hover{background:var(--sage-pale);border-color:var(--sage)}
.student-item.active{background:var(--sage-pale);border-color:var(--sage-2);border-width:2px}
.student-item img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top;
  border:2px solid var(--ink)}
.student-item .placeholder{width:40px;height:40px;border-radius:50%;background:var(--amber-pale);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px}
.student-name{font-weight:700;font-size:14px}
.student-ano{font-size:12px;color:var(--ink-3)}
.student-cond{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--amber-soft);
  color:var(--amber-2);font-weight:700;margin-top:2px;display:inline-block}

/* ── VISUAL AIDS ── */
.visual-aid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:40px}
.visual-block{width:28px;height:28px;border:2px solid var(--ink);border-radius:4px;
  transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:14px}
.visual-block--unit{background:var(--sage-soft)}
.visual-block--ten{background:var(--amber-soft)}
.visual-block--hun{background:var(--coral-soft)}

/* ── GRADE BADGE ── */
.grade-badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;
  font-weight:800;border:1.5px solid var(--ink);background:var(--ink);color:#fff}

/* ── GRADE SELECTOR (for choosing difficulty) ── */
.grade-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.grade-chip{padding:6px 14px;border-radius:999px;border:2px solid var(--border-strong);
  background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;color:var(--ink-2)}
.grade-chip:hover{border-color:var(--sage);color:var(--sage-2)}
.grade-chip.active{background:var(--sage);border-color:var(--sage-2);color:#fff;box-shadow:2px 2px 0 var(--sage-2)}

/* ── TIMELINE ── */
.timeline{display:flex;gap:0;margin-bottom:32px;flex-wrap:wrap}
.tl-step{flex:1;min-width:120px;padding:14px 12px;border:1px solid var(--border);
  background:var(--surface);position:relative}
.tl-step:first-child{border-radius:var(--r-md) 0 0 var(--r-md)}
.tl-step:last-child{border-radius:0 var(--r-md) var(--r-md) 0}
.tl-step:not(:last-child){border-right:none}
.tl-step__num{font-family:'Space Grotesk';font-size:24px;font-weight:800;color:var(--ink-3)}
.tl-step__time{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.tl-step__title{font-size:15px;font-weight:700;margin-top:4px}
.tl-step__desc{font-size:12px;color:var(--ink-3);margin-top:2px}

/* ── MISSION CARD ── */
.mission-card{border:2px solid var(--border-strong);border-radius:var(--r-lg);padding:20px;
  background:var(--surface);cursor:pointer;transition:all .15s;position:relative}
.mission-card:hover{border-color:var(--sage);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.mission-card.done{border-color:var(--sage-2);background:var(--sage-pale)}
.mission-card__tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;
  border-radius:999px;font-size:11px;font-weight:800;margin-bottom:10px}
.mission-card__stars{font-size:16px;letter-spacing:2px}

/* ── NOTA / REGISTRO ── */
.nota-area{width:100%;min-height:90px;border:2px solid var(--border);border-radius:var(--r-md);
  padding:10px 12px;font-size:14px;resize:vertical;background:var(--surface-2);transition:border-color .15s}
.nota-area:focus{outline:none;border-color:var(--sage)}
.saved-flash{color:var(--sage-2);font-size:12px;font-weight:700;opacity:0;transition:opacity .3s}
.saved-flash.show{opacity:1}

/* ── OVERVIEW HERO ── */
.hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;margin:12px 0 36px;align-items:start}
@media(max-width:800px){.hero-grid{grid-template-columns:1fr}}


/* ══ V3 ADDITIONS ══ */
.sesi-brand { display:flex; align-items:center; gap:10px; }
.sesi-logo  { height:36px; width:auto; }
.sesi-divider { width:1px; height:28px; background:var(--border-strong); }

/* ── TELA SELEÇÃO ── */
.tela-selecao { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 20px; }
.selecao-header { text-align:center; margin-bottom:36px; }
.selecao-header h1 { font-family:"Baloo 2",sans-serif; font-size:2.4rem; color:var(--ink); margin:12px 0 6px; line-height:1.1; }
.selecao-header p { color:var(--ink-3); font-size:1rem; }

.alunos-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; max-width:960px; width:100%; }
.aluno-card { background:var(--surface); border:2.5px solid var(--ink); border-radius:20px; padding:16px 12px 14px; cursor:pointer; transition:all .15s; text-align:center; box-shadow:3px 3px 0 var(--ink); }
.aluno-card:hover { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); border-color:var(--sage); }
.aluno-card:active { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }
.aluno-foto { width:88px; height:88px; border-radius:50%; object-fit:cover; object-position:top; border:2.5px solid var(--ink); margin:0 auto 10px; display:block; }
.aluno-foto-placeholder { width:88px; height:88px; border-radius:50%; background:var(--amber-pale); border:2.5px solid var(--ink); margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:40px; }
.aluno-nome { font-weight:700; font-size:13px; line-height:1.3; color:var(--ink); margin-bottom:5px; }
.aluno-serie { font-size:11px; padding:3px 9px; border-radius:999px; background:var(--ink); color:#fff; font-weight:700; display:inline-block; }
.aluno-cond-tag { font-size:10px; color:var(--amber-2); background:var(--amber-pale); padding:2px 7px; border-radius:999px; margin-top:4px; display:inline-block; font-weight:700; }

/* ── MAPA DE FASES (SNAKE PATH) ── */
.mapa-mundo { margin:16px 0; }
.mundo-banner { display:flex; align-items:center; gap:12px; padding:12px 18px; border-radius:var(--r-lg); border:2.5px solid var(--ink); margin-bottom:20px; box-shadow:3px 3px 0 var(--ink); position:relative; overflow:hidden; }
.mundo-banner:before { content:''; position:absolute; inset:0; opacity:.10; }
.mundo-banner__emoji { font-size:32px; flex-shrink:0; }
.mundo-banner__info { flex:1; }
.mundo-banner__title { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:17px; }
.mundo-banner__prog { font-size:12px; color:var(--ink-3); margin-top:2px; }
.mundo-prog-bar { height:5px; background:rgba(0,0,0,.12); border-radius:999px; margin-top:6px; overflow:hidden; }
.mundo-prog-fill { height:100%; border-radius:999px; transition:width .5s ease; }
.mapa-snake-row { display:flex; align-items:center; gap:6px; }
.mapa-snake-row--rtl { flex-direction:row-reverse; }
.mapa-v-connector { width:3px; background:var(--border-strong); border-radius:2px; margin:4px auto; transition:background .3s; }
.mapa-v-connector.done { background:var(--sage); }
.mapa-h-connector { flex:1; height:3px; background:var(--border-strong); border-radius:2px; max-width:28px; transition:background .3s; }
.mapa-h-connector.done { background:var(--sage); }
.fase-item { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; }
.fase-circulo { width:62px; height:62px; border-radius:50%; border:3px solid var(--ink); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; transition:all .15s; box-shadow:3px 3px 0 var(--ink); position:relative; flex-shrink:0; }
.fase-circulo:hover:not(.locked) { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
.fase-circulo.done { background:var(--sage-pale); border-color:var(--sage-2); box-shadow:3px 3px 0 var(--sage-2); }
.fase-circulo.active { background:var(--amber-pale); border-color:var(--amber-2); box-shadow:3px 3px 0 var(--amber-2); animation:pulse-ring 1.5s ease-in-out infinite; }
.fase-circulo.locked { opacity:.45; cursor:default; filter:grayscale(.8); }
.fase-tipo-dot { position:absolute; bottom:-2px; right:-2px; width:16px; height:16px; border-radius:50%; border:2px solid white; font-size:8px; display:grid; place-items:center; }
.fase-stars { font-size:11px; letter-spacing:1px; }
.fase-label { font-size:10px; font-weight:700; color:var(--ink-3); text-align:center; max-width:68px; line-height:1.2; }
.fase-xp-hint { font-size:9px; color:var(--hot); font-weight:800; }
/* legado (mantido para compatibilidade) */
.mapa-fases { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:20px 0; }
.fase-conector { width:24px; height:3px; background:var(--border-strong); border-radius:2px; align-self:flex-start; margin-top:30px; }
.fase-conector.done { background:var(--sage); }
/* ── BUSCA SELEÇÃO ── */
.selecao-search { display:flex; align-items:center; gap:8px; background:var(--surface); border:2px solid var(--border-strong); border-radius:var(--r-xl); padding:10px 16px; max-width:460px; width:100%; margin-bottom:20px; box-shadow:var(--shadow-sm); }
.selecao-search input { flex:1; border:none; background:transparent; font-family:inherit; font-size:15px; color:var(--ink); outline:none; }
.selecao-search input::placeholder { color:var(--ink-soft); }
/* ── STREAK BADGE ── */
@keyframes streak-pop { 0%{transform:scale(.5)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
.streak-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:999px; background:var(--hot); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:13px; animation:streak-pop .35s ease; }
/* ── PROGRESSO NO CARD DE ALUNO ── */
.aluno-prog { height:3px; background:var(--border-strong); border-radius:999px; margin-top:6px; overflow:hidden; }
.aluno-prog-fill { height:100%; background:var(--sage); border-radius:999px; transition:width .4s ease; }

/* ── TUTORIAL MODAL ── */
.tutorial-overlay { position:fixed; inset:0; background:rgba(42,42,40,.6); z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; }
.tutorial-caixa { background:var(--surface); border:3px solid var(--ink); border-radius:28px; padding:32px; max-width:560px; width:100%; box-shadow:6px 6px 0 var(--ink); animation:pop-in .35s ease; max-height:88vh; overflow-y:auto; }
.tutorial-icone { font-size:4rem; text-align:center; display:block; margin-bottom:10px; }
.tutorial-titulo { font-family:"Baloo 2",sans-serif; font-size:1.6rem; color:var(--ink); margin-bottom:8px; text-align:center; }
.tutorial-svg { margin:16px auto; display:block; max-width:320px; }
.tutorial-steps { list-style:none; margin:14px 0; display:flex; flex-direction:column; gap:8px; }
.tutorial-steps li { display:flex; gap:10px; align-items:flex-start; font-size:15px; padding:10px 14px; background:var(--surface-2); border-radius:var(--r-md); border-left:4px solid var(--amber); }
.tutorial-steps li span.num { font-family:"Space Grotesk",sans-serif; font-weight:800; font-size:18px; color:var(--amber-2); min-width:24px; }

/* ── LIVROS ── */
.livros-area { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media(max-width:700px) { .livros-area { grid-template-columns:1fr; } }
.livro-card { background:var(--surface); border:2px solid var(--border); border-radius:var(--r-lg); padding:18px; transition:all .12s; cursor:pointer; }
.livro-card:hover { border-color:var(--sage); transform:translateY(-2px); box-shadow:var(--shadow-md); }
.livro-spine { width:100%; height:8px; border-radius:4px; margin-bottom:12px; }
.livro-titulo { font-weight:700; font-size:15px; margin-bottom:4px; }
.livro-meta { font-size:12px; color:var(--ink-3); }
.livros-vazia { text-align:center; padding:48px 24px; color:var(--ink-3); border:2px dashed var(--border-strong); border-radius:var(--r-xl); }
.tutor-ia-box { background:linear-gradient(135deg,var(--plum-pale),var(--sky-pale)); border:2px solid var(--plum); border-radius:var(--r-xl); padding:24px; }
.chat-livros { border:1.5px solid var(--border); border-radius:var(--r-lg); overflow:hidden; margin-top:16px; }
.chat-livros-msgs { height:220px; overflow-y:auto; padding:14px; background:var(--surface-2); display:flex; flex-direction:column; gap:8px; }
.msg-ia { background:var(--surface); border:1px solid var(--border); padding:10px 14px; border-radius:14px 14px 14px 4px; font-size:14px; max-width:85%; line-height:1.5; }
.msg-user { background:var(--sage); color:#fff; padding:10px 14px; border-radius:14px 14px 4px 14px; font-size:14px; max-width:85%; align-self:flex-end; }
.chat-livros-input { display:flex; gap:8px; padding:10px; background:var(--surface); border-top:1px solid var(--border); }
.chat-livros-input input { flex:1; border:1.5px solid var(--border); border-radius:8px; padding:8px 12px; font-family:inherit; font-size:14px; }
.chat-livros-input input:focus { outline:none; border-color:var(--plum); }
.chat-livros-input button { background:var(--plum); color:#fff; border:none; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:16px; }

/* ── ANIMAÇÃO SEQUÊNCIA ── */
@keyframes bounce-in { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
.seq-item { display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:14px; border:2.5px solid var(--ink); font-family:"Space Grotesk",sans-serif; font-weight:800; font-size:20px; cursor:pointer; transition:all .15s; box-shadow:2px 2px 0 var(--ink); background:var(--surface); }
.seq-item:hover { background:var(--amber-pale); transform:translateY(-2px); }
.seq-item.vazio { background:var(--bg-warm); border-style:dashed; color:var(--ink-3); font-size:28px; }
.seq-item.correto { background:var(--sage-pale); border-color:var(--sage-2); color:var(--sage-2); }

/* ── DINHEIRO ── */
.nota { display:inline-flex; align-items:center; justify-content:center; border-radius:8px; border:2.5px solid var(--ink); font-family:"Space Grotesk",sans-serif; font-weight:800; cursor:pointer; transition:all .12s; box-shadow:2px 2px 0 var(--ink); user-select:none; }
.nota:hover { transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); }
.nota:active { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }

/* ── AREA/PERIM ── */
.grid-quadrado { display:grid; border:2px solid var(--ink); border-radius:4px; overflow:hidden; }
.celula { border:1px solid var(--border-strong); cursor:pointer; transition:background .1s; }
.celula.on { background:var(--sage-soft); }
.celula:hover { background:var(--amber-soft); }


/* ══ SUPER FASES — COMPONENTES NOVOS ══ */
.super-panel{background:linear-gradient(135deg,var(--surface),var(--sky-pale));border:2.5px solid var(--ink);border-radius:28px;padding:18px;box-shadow:4px 4px 0 var(--ink);position:relative;overflow:hidden}
.super-panel:before{content:"";position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;background:rgba(126,92,196,.10)}
.super-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;position:relative;z-index:1}
.super-title{font-family:'Space Grotesk';font-weight:800;font-size:18px;letter-spacing:-.02em}
.super-sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.super-stage{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}.super-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface)}.super-dot.done{background:var(--sage);border-color:var(--sage-2)}.super-dot.now{background:var(--amber);border-color:var(--amber-2);transform:scale(1.25)}
.super-card{background:var(--surface);border:2px solid var(--border-strong);border-radius:22px;padding:16px;box-shadow:2px 2px 0 var(--border-strong);position:relative;z-index:1}.super-card--hot{background:var(--coral-pale);border-color:var(--coral)}.super-card--sage{background:var(--sage-pale);border-color:var(--sage)}.super-card--sky{background:var(--sky-pale);border-color:var(--sky)}
.super-big-number{font-family:'Baloo 2','Space Grotesk',sans-serif;font-size:56px;line-height:1;font-weight:800;color:var(--ink);text-align:center;text-shadow:2px 2px 0 var(--amber-soft)}
.super-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.super-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.super-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.super-grid,.super-grid-3,.super-grid-4{grid-template-columns:1fr}}
.super-option{padding:15px 14px;border:2.5px solid var(--ink);border-radius:18px;background:var(--surface);box-shadow:3px 3px 0 var(--ink);font-weight:800;text-align:center;transition:all .12s;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.super-option:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--surface-2)}.super-option.ok{background:var(--sage-pale);border-color:var(--sage-2);box-shadow:3px 3px 0 var(--sage-2);color:var(--sage-2)}.super-option.ko{background:var(--coral-pale);border-color:var(--coral-2);box-shadow:3px 3px 0 var(--coral-2);color:var(--coral-2)}
.super-feedback{margin-top:12px;padding:12px 14px;border-radius:18px;font-weight:700;font-size:14px;animation:slide-up .25s ease}.super-feedback.ok{background:var(--sage-pale);border:2px dashed var(--sage);color:var(--sage-2)}.super-feedback.ko{background:var(--coral-pale);border:2px dashed var(--coral);color:var(--coral-2)}
.manipulatives{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:10px}.manip-block{min-width:30px;height:30px;border:2px solid var(--ink);border-radius:8px;background:var(--sage-soft);display:grid;place-items:center;font-weight:800}.manip-ten{width:42px;background:var(--amber-soft)}.manip-hun{width:48px;height:48px;background:var(--coral-soft)}
.number-line{position:relative;height:78px;margin:12px 0 2px;border-bottom:4px solid var(--ink)}.number-line .tick{position:absolute;bottom:-8px;width:3px;height:22px;background:var(--ink);transform:translateX(-50%)}.number-line .tick span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--ink-2)}.number-line .pin{position:absolute;bottom:21px;transform:translateX(-50%);font-size:34px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.15))}
/* ── BOAS-VINDAS ── */
.tela-bv{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;background:radial-gradient(circle at 50% 20%,rgba(79,153,104,.18),transparent 55%),var(--bg);text-align:center}
.bv-foto{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:top;border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);margin-bottom:14px;animation:pop-in .5s ease}
.fala-bubble{background:var(--surface);border:2.5px solid var(--ink);border-radius:22px 22px 22px 4px;padding:16px 22px;font-size:17px;font-weight:700;line-height:1.55;max-width:340px;box-shadow:3px 3px 0 var(--ink);margin-bottom:16px;white-space:pre-line}
.btn-jogar{font-size:22px;padding:20px 56px;border-radius:22px;background:var(--sage);color:#fff;border:3px solid var(--sage-2);box-shadow:5px 5px 0 var(--sage-2);cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:800;transition:all .15s;animation:pop-in .6s ease .2s both}
.btn-jogar:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--sage-2)}.btn-jogar:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--sage-2)}
/* ── GUIA MASCOTE ── */
.guia-bar{background:var(--amber-pale);border-bottom:2px solid var(--amber-soft);padding:10px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:64px;z-index:40}
.guia-texto{font-size:15px;font-weight:700;color:var(--ink-2);flex:1}
@keyframes pulse-border{0%,100%{box-shadow:4px 4px 0 var(--amber-2),0 0 0 0 rgba(232,174,46,.6)}50%{box-shadow:4px 4px 0 var(--amber-2),0 0 0 8px rgba(232,174,46,0)}}
@keyframes bounce-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes float-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes star-pop{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.3) rotate(5deg)}100%{transform:scale(1) rotate(0deg)}}
/* ── 3D CARD ── */
.card-3d{perspective:600px}.card-3d-inner{transform-style:preserve-3d;transition:transform .15s ease,box-shadow .15s ease}
/* ── STUDENT BADGE ── */
.student-badge-jogo{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(135deg,var(--plum-pale),var(--sky-pale));border:2.5px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 var(--ink),0 8px 24px rgba(0,0,0,.12);margin-bottom:14px;animation:float-in .4s ease}
.student-badge-foto{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);flex-shrink:0}
.student-badge-avatar{width:46px;height:46px;border-radius:50%;background:var(--amber-pale);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
/* ── GAME CARD 3D ── */
.game-card-3d{background:var(--surface);border:2.5px solid var(--ink);border-radius:22px;padding:22px;box-shadow:0 8px 0 var(--ink),0 12px 32px rgba(0,0,0,.15);position:relative;overflow:hidden}
.game-card-3d::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,transparent 50%);pointer-events:none;border-radius:20px}
/* ── XP STAR ANIMATION ── */
.xp-star{position:fixed;pointer-events:none;font-size:28px;font-weight:800;color:var(--amber);animation:xp-float 1.2s ease forwards;z-index:9999}
@keyframes xp-float{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.4)}}
.match-board{display:grid;grid-template-columns:1fr 1fr;gap:14px}.match-col{display:grid;gap:8px}.match-item{padding:12px;border:2px solid var(--ink);border-radius:16px;background:var(--surface);box-shadow:2px 2px 0 var(--ink);font-weight:800;cursor:pointer;text-align:center}.match-item.sel{background:var(--amber-pale);border-color:var(--amber-2);box-shadow:2px 2px 0 var(--amber-2)}.match-item.done{background:var(--sage-pale);border-color:var(--sage-2);box-shadow:2px 2px 0 var(--sage-2);color:var(--sage-2)}
.cart-grid{display:grid;grid-template-columns:repeat(5,42px);grid-template-rows:repeat(5,42px);gap:4px;justify-content:center;margin:12px auto}.cart-cell{border:1.5px solid var(--border-strong);background:var(--surface-2);border-radius:8px;display:grid;place-items:center;font-size:18px;font-weight:800}.cart-cell.point{background:var(--hot-soft);border:2.5px solid var(--hot);animation:pop-in .35s ease}.mini-bars{display:flex;align-items:end;gap:10px;height:120px;justify-content:center;padding:10px 8px;border-bottom:3px solid var(--ink)}.mini-bar{width:42px;border:2px solid var(--ink);border-radius:10px 10px 0 0;background:var(--sky-soft);display:flex;align-items:start;justify-content:center;font-weight:800;padding-top:5px}.mini-bar-labels{display:flex;gap:10px;justify-content:center}.mini-bar-labels span{width:42px;text-align:center;font-size:12px;font-weight:800}.diagnostico-table{width:100%;border-collapse:separate;border-spacing:0 8px}.diagnostico-table td,.diagnostico-table th{font-size:13px;text-align:left;padding:8px 10px;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.diagnostico-table td:first-child,.diagnostico-table th:first-child{border-left:1px solid var(--border);border-radius:12px 0 0 12px}.diagnostico-table td:last-child,.diagnostico-table th:last-child{border-right:1px solid var(--border);border-radius:0 12px 12px 0}.skill-pill{display:inline-flex;padding:3px 9px;border-radius:999px;background:var(--plum-pale);color:var(--plum-2);font-size:11px;font-weight:800;margin:2px}


/* ══ PATCH GABRIEL 2026-05-12 · Tutor local, sons amigáveis e universo 3D ══ */
@keyframes amigo-flutua{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes amigo-caminha{0%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}100%{transform:translateX(-8px) rotate(-3deg)}}
@keyframes brilho-soft{0%,100%{box-shadow:0 0 0 0 rgba(126,92,196,.22)}50%{box-shadow:0 0 0 10px rgba(126,92,196,0)}}
.universo-3d{position:relative;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 14px;margin:0 0 14px;background:linear-gradient(135deg,var(--plum-pale),var(--sky-pale));border:2px solid var(--plum);border-radius:22px;overflow:hidden}
.universo-3d:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 20%,rgba(255,255,255,.55),transparent 32%),radial-gradient(circle at 88% 70%,rgba(232,174,46,.20),transparent 30%);pointer-events:none}
.personagem-3d{position:relative;z-index:1;width:74px;min-height:86px;border:2.5px solid var(--ink);border-radius:22px;background:linear-gradient(180deg,#fff,var(--surface-2));box-shadow:0 7px 0 var(--ink),0 12px 26px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;animation:amigo-flutua 3.2s ease-in-out infinite;cursor:default;transform-style:preserve-3d}
.personagem-3d:nth-child(2n){animation-name:amigo-caminha;animation-duration:3.7s}.personagem-3d:nth-child(3n){animation-delay:.5s}.personagem-3d .p-emoji{font-size:32px;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.14))}.personagem-3d .p-nome{font-size:10px;color:var(--ink-2)}
.personagem-3d--mini{width:54px;min-height:62px;border-radius:18px;box-shadow:0 4px 0 var(--ink),0 8px 16px rgba(0,0,0,.10)}.personagem-3d--mini .p-emoji{font-size:24px}.personagem-3d--mini .p-nome{display:none}
.livro-index-card{background:var(--surface);border:2px solid var(--border-strong);border-radius:18px;padding:12px 14px;box-shadow:2px 2px 0 var(--border-strong);position:relative;overflow:hidden}
.livro-index-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--plum)}
.index-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;margin:2px;border-radius:999px;background:var(--plum-pale);color:var(--plum-2);font-size:10px;font-weight:800}
.livro-visual-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.livro-visual-card{border:2px solid var(--ink);border-radius:16px;background:var(--surface);padding:10px;text-align:center;box-shadow:2px 2px 0 var(--ink);cursor:pointer;transition:all .12s}.livro-visual-card:hover,.livro-visual-card.sel{transform:translateY(-2px);background:var(--amber-pale);box-shadow:3px 5px 0 var(--amber-2);border-color:var(--amber-2)}
.tutor-status{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--plum-2);font-weight:800}.tutor-status span{background:rgba(255,255,255,.7);border:1px solid var(--plum);border-radius:999px;padding:3px 8px}

</style>

const { useState, useEffect, useRef, useCallback, useMemo } = React;

let _ac=null;
const getAC=()=>{if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;};
const playTone=(freqs,dur=0.4,type='sine')=>{
  if(!window.__soundsOn)return;
  try{
    const ac=getAC(),t=ac.currentTime;
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.09);
      g.gain.linearRampToValueAtTime(0.14,t+i*.09+.04);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*.09+dur);
      o.connect(g);g.connect(ac.destination);
      o.start(t+i*.09);o.stop(t+i*.09+dur+.05);
    });
  }catch(e){}
};

window.__voiceOn=false;
window.__volume=0.9;
window.__voiceRate=0.9;
window.__voiceTimers=[];
window.__pararVoz=()=>{
  window.__voiceTimers.forEach(clearTimeout);
  window.__voiceTimers=[];
  try{window.speechSynthesis.cancel();}catch(e){}
};
window.__falar=(texto,taxa)=>{
  if(!window.__voiceOn||!texto)return;
  window.__pararVoz();
  try{
    const ss=window.speechSynthesis;
    const limpo=texto.replace(/[\u{1F300}-\u{1FAFF}]/gu,' ').replace(/\s+/g,' ').trim();
    const vs=ss.getVoices();
    const ptBR=vs.find(v=>v.lang==='pt-BR')||vs.find(v=>v.lang.startsWith('pt'))||null;
    const frases=limpo.split(/(?<=[.!?])\s+/).filter(s=>s.trim());
    let t=0;
    (frases.length?frases:[limpo]).forEach(fr=>{
      const tid=setTimeout(()=>{
        if(!window.__voiceOn)return;
        const u=new SpeechSynthesisUtterance(fr.trim());
        u.lang='pt-BR';u.volume=window.__volume;
        const excl=/[!]|Parabéns|Incrível|Arrasou|Sim|Isso/.test(fr);
        u.rate=(taxa||window.__voiceRate)*(excl?1.1:1);
        u.pitch=excl?1.55:1.25;
        if(ptBR)u.voice=ptBR;
        ss.speak(u);
      },t);
      window.__voiceTimers.push(tid);
      t+=80;
    });
  }catch(e){}
};

// Quiz genérico
const QuizGame=({perguntas,onXP})=>{
  const [idx,setIdx]=useState(0);
  const [fb,setFb]=useState(null);
  const [acertos,setAcertos]=useState(0);
  const [done,setDone]=useState(false);
  const [celebrar,setCelebrar]=useState(false);
  const [streak,setStreak]=useState(0);
  const [streakBonus,setStreakBonus]=useState(null);
  const p=perguntas[idx];
  // leitura automática ao trocar questão
  useEffect(()=>{if(p?.q)window.__falar(p.q);},[idx]);
  // leitura do feedback
  useEffect(()=>{
    if(!fb)return;
    const txt=fb.ok?('Correto! '+(p.exp||'Ótimo!')) : ('Quase! '+(p.dica||'A resposta correta está em verde.'));
    window.__falar(txt);
  },[fb]);
  const responder=(i)=>{
    if(fb)return; window.playClick();
    const ok=i===p.c;
    if(ok){
      window.playSuccess();setAcertos(a=>a+1);
      const ns=streak+1;setStreak(ns);
      if(ns>=3){window.playMega&&window.playMega();onXP(50);setStreakBonus(ns);setTimeout(()=>setStreakBonus(null),2000);}
      else onXP(25);
    }else{window.playRetry();setStreak(0);}
    setFb({ok,i});
  };
  const proximo=()=>{
    if(idx<perguntas.length-1){setIdx(i=>i+1);setFb(null);}
    else{setDone(true);setCelebrar(true);window.playMega();onXP(50);setTimeout(()=>setCelebrar(false),2500);}
  };
  const reiniciar=()=>{setIdx(0);setFb(null);setDone(false);setAcertos(0);setCelebrar(false);setStreak(0);};
  if(done)return(
    <div style={{textAlign:'center',padding:'16px 0'}}>
      <Confetti active={celebrar}/>
      <Mascot size={90} mood="celebrate" className="mascot--celebrate"/>
      <div style={{fontFamily:'Space Grotesk',fontSize:26,fontWeight:800,margin:'10px 0 4px'}}>{acertos}/{perguntas.length} acertos! 🏆</div>
      <div style={{color:'var(--sage-2)',fontWeight:700,fontSize:15,marginBottom:16}}>{acertos===perguntas.length?'⭐⭐⭐ Perfeito!':acertos>=Math.ceil(perguntas.length*.7)?'⭐⭐ Muito bem!':'⭐ Continue praticando!'}</div>
      <button className="btn btn--primary" onClick={reiniciar}>🔄 Jogar de novo</button>
    </div>
  );
  return(
    <div>
      {streakBonus&&<div style={{textAlign:'center',marginBottom:8}}><span className="streak-badge">🔥 {streakBonus} seguidos! +50 XP</span></div>}
      <div className="progress-dots">{perguntas.map((_,i)=><div key={i} className={`pdot${i<idx?' pdot--done':i===idx?' pdot--now':''}`}/>)}</div>
      {streak>=2&&!streakBonus&&<div style={{textAlign:'center',marginBottom:6}}><span className="streak-badge">🔥 Sequência: {streak}</span></div>}
      {p.visual&&<div style={{textAlign:'center',margin:'0 0 12px'}}>{p.visual}</div>}
      <div className="game-enunciado" style={{position:'relative'}}>
        {p.q}
        <button onClick={()=>window.__falar(p.q)} title="Ouvir pergunta" style={{position:'absolute',top:6,right:6,background:'var(--plum-pale)',border:'1.5px solid var(--plum)',borderRadius:8,cursor:'pointer',fontSize:15,padding:'2px 7px',lineHeight:1}}>🔊</button>
      </div>
      <div className={`game-opcoes${p.ops.length<=4?' game-opcoes--2col':''}`}>
        {p.ops.map((op,i)=>{let cls='opcao';if(fb)cls+=i===p.c?' opcao--certa':i===fb.i?' opcao--errada':'';return <button key={i} className={cls} onClick={()=>responder(i)} disabled={!!fb}>{op}</button>;})}
      </div>
      {fb&&<div className={`feedback-box feedback-box--${fb.ok?'ok':'ko'} anim-slide`}>
        <strong>{fb.ok?'🎉 Acertou!':'🤔 Quase!'}</strong>{' '}
        {fb.ok?(p.exp||'Ótimo raciocínio!'): (p.dica||'A resposta correta está destacada em verde.')}
      </div>}
      {fb&&<div style={{marginTop:10,textAlign:'right'}}><button className="btn btn--primary btn--sm" onClick={proximo}>{idx<perguntas.length-1?'Próxima ➜':'Ver resultado 🏆'}</button></div>}
    </div>
  );
};

// Material Dourado
const GameMaterialDourado=({onXP,maxNum=999})=>{
  const [target]=useState(()=>10+Math.floor(Math.random()*(maxNum-10)));
  const [u,setU]=useState(0),[d,setD]=useState(0),[c,setC]=useState(0);
  const total=u+d*10+c*100;
  const [fb,setFb]=useState(null);
  const check=()=>{window.playClick();if(total===target){window.playSuccess();onXP(30);setFb({ok:true});}else{window.playRetry();setFb({ok:false,diff:total-target});}};
  return(
    <div>
      <div style={{padding:'14px',background:'var(--amber-pale)',border:'2.5px solid var(--ink)',borderRadius:12,marginBottom:14,textAlign:'center'}}>
        <div style={{fontSize:11,fontWeight:800,color:'var(--ink-3)',letterSpacing:'.1em',textTransform:'uppercase'}}>Monte o número</div>
        <div style={{fontFamily:'Space Grotesk',fontSize:52,fontWeight:800,lineHeight:1}}>{target}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
        {[{l:'🟥 Centena',v:c,s:setC,bg:'var(--coral-soft)',fg:'var(--coral-2)'},{l:'🟨 Dezena',v:d,s:setD,bg:'var(--amber-soft)',fg:'var(--amber-2)'},{l:'🟩 Unidade',v:u,s:setU,bg:'var(--sage-soft)',fg:'var(--sage-2)'}].map((it,i)=>(
          <div key={i} style={{padding:10,background:it.bg,border:`2px solid ${it.fg}`,borderRadius:10}}>
            <div style={{fontSize:10,fontWeight:800,color:it.fg,marginBottom:4,textAlign:'center'}}>{it.l}</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:2,minHeight:28,justifyContent:'center',marginBottom:6}}>
              {Array.from({length:Math.min(it.v,9)}).map((_,k)=><div key={k} style={{width:16,height:16,background:it.fg,borderRadius:2,border:'1px solid rgba(0,0,0,.2)'}}/>)}
              {it.v>9&&<div style={{fontSize:10,fontWeight:700,color:it.fg}}>+{it.v-9}</div>}
            </div>
            <div style={{display:'flex',gap:4,alignItems:'center',justifyContent:'center'}}>
              <button onClick={()=>{it.s(Math.max(0,it.v-1));window.playClick();}} style={{width:28,height:28,borderRadius:6,border:`2px solid ${it.fg}`,background:'white',fontWeight:800,fontSize:16,cursor:'pointer'}}>−</button>
              <span style={{minWidth:24,textAlign:'center',fontFamily:'Space Grotesk',fontWeight:800,fontSize:18}}>{it.v}</span>
              <button onClick={()=>{it.s(it.v+1);window.playClick();}} style={{width:28,height:28,borderRadius:6,border:`2px solid ${it.fg}`,background:'white',fontWeight:800,fontSize:16,cursor:'pointer'}}>+</button>
            </div>
          </div>
        ))}
      </div>
      <div style={{textAlign:'center',margin:'12px 0 8px',fontFamily:'Space Grotesk',fontSize:26,fontWeight:700}}>
        Você montou: <span style={{color:total===target?'var(--sage-2)':total===0?'var(--ink-3)':'var(--coral-2)'}}>{total}</span>
      </div>
      <div style={{textAlign:'center'}}><button className="btn btn--primary" onClick={check}>Conferir ✓</button></div>
      {fb&&<div className={`feedback-box feedback-box--${fb.ok?'ok':'ko'} anim-slide`}>{fb.ok?<strong>🎉 Perfeito! +30 XP</strong>:<><strong>{fb.diff>0?'Passou':fb.diff<0?'Faltou':''} {Math.abs(fb.diff)}!</strong> Ajuste as peças.</>}</div>}
    </div>
  );
};

// Pizza Fração
const GameFracao=({onXP})=>{
  const numList=[2,3,4,5,6,8];
  const [den]=useState(()=>numList[Math.floor(Math.random()*numList.length)]);
  const [num]=useState(()=>1+Math.floor(Math.random()*(den-1)));
  const [escolha,setEscolha]=useState(null);
  const cf=`${num}/${den}`;
  const ops=(()=>{const s=new Set([cf]);while(s.size<4){const n=1+Math.floor(Math.random()*den),d=numList[Math.floor(Math.random()*numList.length)];if(n<d)s.add(`${n}/${d}`);}return[...s].sort(()=>Math.random()-.5);})();
  const choose=(f)=>{setEscolha(f);window.playClick();f===cf?window.playSuccess()&&onXP(20):window.playRetry();};
  const sliceDeg=360/den;
  return(
    <div>
      <div className="game-enunciado">🍕 Quantas fatias <strong>coloridas</strong> você vê? Escolha a fração!</div>
      <div style={{textAlign:'center',margin:'14px 0'}}>
        <svg width={150} height={150} viewBox="-80 -80 160 160">
          {Array.from({length:den}).map((_,i)=>{
            const a1=(i*sliceDeg-90)*Math.PI/180,a2=((i+1)*sliceDeg-90)*Math.PI/180;
            const x1=Math.cos(a1)*70,y1=Math.sin(a1)*70,x2=Math.cos(a2)*70,y2=Math.sin(a2)*70;
            return <path key={i} d={`M0,0 L${x1},${y1} A70,70 0 ${sliceDeg>180?1:0},1 ${x2},${y2} Z`} fill={i<num?'#E96B4F':'#F8F2DF'} stroke="#2A2A28" strokeWidth="1.5"/>;
          })}
          <circle cx="0" cy="0" r="7" fill="#FFFCF4" stroke="#2A2A28" strokeWidth="1.5"/>
        </svg>
      </div>
      <div className="game-opcoes game-opcoes--2col">{ops.map(f=>{let cls='opcao';if(escolha)cls+=f===cf?' opcao--certa':f===escolha?' opcao--errada':'';return <button key={f} className={cls} onClick={()=>choose(f)} disabled={!!escolha} style={{fontSize:22,fontFamily:'Space Grotesk'}}>{f}</button>;})}</div>
      {escolha&&<div className={`feedback-box feedback-box--${escolha===cf?'ok':'ko'} anim-slide`}>{escolha===cf?<><strong>🍕 Certo!</strong> {num} fatia{num>1?'s':''} de {den} = {cf}</>:<><strong>🔍 Olhe de novo.</strong> {num} fatia{num>1?'s':''} pintada{num>1?'s':''} → total {den} → é {cf}</>}</div>}
    </div>
  );
};

const GameTransferidor=({onXP})=>{

const EMOJIS_INFANTIS=['🍎','🐤','⭐','🌸','🐟','🦋','🎈','🍊','🐸','🍬','🐣','🌈'];
const _gerarOps=(certa,max,qtd=4)=>{
  const s=new Set([certa]);
  let t=0;
  while(s.size<qtd&&t<40){s.add(Math.max(1,certa+Math.floor(Math.random()*(max*0.6+2))-Math.floor(max*0.3+1)));t++;}
  return[...s].sort(()=>Math.random()-.5).slice(0,qtd);
};

// 1. CONTAR EMOJIS — vê e escolhe a quantidade
const GameContarEmojis=({onXP,maxN=10})=>{

    const n=1+Math.floor(Math.random()*maxN);
    const em=EMOJIS_INFANTIS[Math.floor(Math.random()*EMOJIS_INFANTIS.length)];
    return{n,em,ops:_gerarOps(n,maxN),fb:null};
  };
  const [q,setQ]=useState(novo);
  const check=(v)=>{
    if(q.fb)return;window.playClick();
    if(v===q.n){window.playSuccess();onXP(20);window.__falar(window.__fraseCerta()+` São ${q.n}!`);}
    else{window.playRetry();window.__falar(window.__fraseErro()+` São ${q.n}!`);}
    setQ(s=>({...s,fb:v===q.n?'ok':'ko',errou:v}));
  };
  return(
    <div style={{textAlign:'center'}}>
      <div style={{fontSize:18,fontWeight:800,marginBottom:14,color:'var(--ink-2)'}}>🔢 Conta quantos tem!</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center',background:'var(--sky-pale)',border:'2.5px solid var(--sky)',borderRadius:20,padding:'18px',marginBottom:18,minHeight:80}}>
        {Array.from({length:q.n}).map((_,i)=><span key={i} style={{fontSize:40,animation:`pop-in .3s ease ${i*.06}s both`}}>{q.em}</span>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
        {q.ops.map((v,i)=>(
          <button key={i} className={`super-option${q.fb?(v===q.n?' ok':v===q.errou?' ko':''):''}`}
            style={{fontSize:28,fontWeight:800,borderRadius:18,minHeight:64}} onClick={()=>check(v)} disabled={!!q.fb}>{v}</button>

// 2. MAIS OU MENOS — comparar quantidades visualmente
const GameMaisOuMenos=({onXP,maxN=6})=>{

// ── 1. LIGAR — conectar pares por clique ──
const GameLigar=({onXP,pares,titulo='Ligue cada um ao seu par!'})=>{
  const [selA,setSelA]=useState(null);
  const [feitos,setFeitos]=useState({});
  const [errado,setErrado]=useState(null);
  const [tentativas,setTentativas]=useState(0);
  const [embaralhado]=useState(()=>({
    col_a:[...pares].sort(()=>Math.random()-.5),
    col_b:[...pares].sort(()=>Math.random()-.5),
  }));
  useEffect(()=>{window.__falar(titulo);},[]);
  const clicarA=(par)=>{if(feitos[par.id])return;setSelA(par);setErrado(null);window.playClick();};
  const clicarB=(par)=>{
    if(!selA)return;
    if(feitos[par.id])return;
    setTentativas(t=>t+1);
    if(selA.id===par.id){
      window.playSuccess();
      const nf={...feitos,[par.id]:true};
      setFeitos(nf);setSelA(null);
      if(Object.keys(nf).length===pares.length){
        window.__falar(window.__fraseCerta()+' Você ligou todos os pares!');
        onXP(20+Math.max(0,10-tentativas));
      }else window.__falar('Isso! Par correto!');
    }else{
      window.playRetry();setErrado(par.id);window.__falar(window.__fraseErro());
      setTimeout(()=>setErrado(null),700);
    }
    setSelA(null);
  };
  const todos=Object.keys(feitos).length===pares.length;
  const instru=selA?`Toque no par de: ${selA.a}`:'Toque em um item da esquerda para selecionar.';
  useEffect(()=>{if(selA)window.__falar(instru);},[selA?.id]);
  return(
    <div>
      <div style={{fontWeight:800,fontSize:17,marginBottom:10,textAlign:'center'}}>{titulo}</div>
      <div style={{textAlign:'center',marginBottom:10,padding:'8px 12px',background:selA?'var(--amber-pale)':'var(--surface-2)',border:`1.5px solid ${selA?'var(--amber)':'var(--border)'}`,borderRadius:12,fontSize:13,fontWeight:700,color:selA?'var(--amber-2)':'var(--ink-3)'}}>
        {selA?`✋ Agora toque no par de: ${selA.a}`:'👆 Toque em um item da esquerda'}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <div style={{display:'flex',flexDirection:'column',gap:7}}>
          <div style={{textAlign:'center',fontSize:11,fontWeight:700,color:'var(--ink-3)',marginBottom:2}}>Coluna A</div>
          {embaralhado.col_a.map(p=>(
            <button key={p.id} onClick={()=>clicarA(p)} disabled={!!feitos[p.id]}
              style={{padding:'12px 8px',borderRadius:14,border:`2.5px solid ${feitos[p.id]?'var(--sage-2)':selA?.id===p.id?'var(--amber-2)':'var(--ink)'}`,background:feitos[p.id]?'var(--sage-pale)':selA?.id===p.id?'var(--amber-pale)':'var(--surface)',fontWeight:800,fontSize:17,boxShadow:feitos[p.id]?'0 3px 0 var(--sage-2)':selA?.id===p.id?'0 4px 0 var(--amber-2)':'0 4px 0 var(--ink)',transition:'all .12s',cursor:feitos[p.id]?'default':'pointer',fontFamily:'inherit',transform:selA?.id===p.id?'translateY(-2px)':'none',textAlign:'center'}}>
              {feitos[p.id]?'✅':p.a}
            </button>
          ))}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:7}}>
          <div style={{textAlign:'center',fontSize:11,fontWeight:700,color:'var(--ink-3)',marginBottom:2}}>Coluna B</div>
          {embaralhado.col_b.map(p=>(
            <button key={p.id} onClick={()=>clicarB(p)} disabled={!!feitos[p.id]||!selA}
              style={{padding:'12px 8px',borderRadius:14,border:`2.5px solid ${feitos[p.id]?'var(--sage-2)':errado===p.id?'var(--coral-2)':selA?'var(--ink)':'var(--border)'}`,background:feitos[p.id]?'var(--sage-pale)':errado===p.id?'var(--coral-pale)':selA?'var(--surface-2)':'var(--surface)',fontWeight:800,fontSize:17,boxShadow:feitos[p.id]?'0 3px 0 var(--sage-2)':selA?'0 4px 0 var(--ink)':'none',transition:'all .12s',cursor:(!selA||feitos[p.id])?'default':'pointer',fontFamily:'inherit',opacity:selA?1:0.5,textAlign:'center'}}>
              {feitos[p.id]?'✅':p.b}
            </button>
          ))}
        </div>
      </div>
      {todos&&(
        <div>
          <div className="super-feedback ok" style={{marginTop:12,fontSize:15}}>🎉 Parabéns! Todos os pares ligados!</div>
        </div>
      )}
    </div>
  );
};

// ── 2. ARRASTAR — clicar item → clicar zona ──
const GameArrastar=({onXP,itens,grupos,titulo='Coloque cada item no lugar certo!'})=>{
  // itens=[{id,emoji,label,grupo}], grupos=[{id,label,cor,bg}]
  const [postos,setPostos]=useState({}); // itemId → grupoId
  const [selItem,setSelItem]=useState(null);
  const [errando,setErrando]=useState(null);
  const naoPostos=itens.filter(it=>!postos[it.id]);
  const todos=naoPostos.length===0;
  const acertos=Object.entries(postos).filter(([id,gid])=>itens.find(i=>i.id===id)?.grupo===gid).length;
  const clicarItem=(it)=>{setSelItem(it);window.playClick();window.__falar(`${it.label}. Onde vai?`);};
  const clicarGrupo=(gid)=>{
    if(!selItem)return;
    const certo=selItem.grupo===gid;
    if(certo){
      window.playSuccess();
      setPostos(p=>({...p,[selItem.id]:gid}));
      setSelItem(null);
      const faltam=itens.length-Object.keys({...postos,[selItem.id]:gid}).length;
      if(faltam===0){window.__falar(window.__fraseCerta()+' Separou tudo!');onXP(25);}
      else window.__falar('Isso! Lugar certo!');
    }else{
      window.playRetry();setErrando(gid);window.__falar(window.__fraseErro());
      setTimeout(()=>setErrando(null),600);
    }
  };
  useEffect(()=>{window.__falar(titulo);},[]);
  return(
    <div>
      <div style={{fontWeight:800,fontSize:17,marginBottom:14,textAlign:'center'}}>{titulo}</div>
      {!todos&&<div style={{marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:700,color:'var(--ink-3)',marginBottom:8,textAlign:'center'}}>
          {selItem?<span style={{color:'var(--amber-2)'}}>✋ Agora toque no grupo onde <strong>{selItem.label}</strong> pertence!</span>:'👆 Toque num item para selecioná-lo'}
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',justifyContent:'center'}}>
          {naoPostos.map(it=>(
            <button key={it.id} onClick={()=>clicarItem(it)}
              style={{padding:'14px 16px',borderRadius:18,border:`3px solid ${selItem?.id===it.id?'var(--amber-2)':'var(--ink)'}`,background:selItem?.id===it.id?'var(--amber-pale)':'var(--surface)',boxShadow:selItem?.id===it.id?'0 5px 0 var(--amber-2)':'0 5px 0 var(--ink)',fontWeight:800,fontSize:22,cursor:'pointer',fontFamily:'inherit',transform:selItem?.id===it.id?'translateY(-3px)':'none',transition:'all .12s'}}>
              {it.emoji}<div style={{fontSize:11,marginTop:4}}>{it.label}</div>
            </button>
          ))}
        </div>
      </div>}
      {/* Zonas */}
      <div style={{display:'grid',gridTemplateColumns:`repeat(${grupos.length},1fr)`,gap:10}}>
        {grupos.map(g=>{
          const aqui=itens.filter(it=>postos[it.id]===g.id);
          return(
            <div key={g.id} onClick={()=>clicarGrupo(g.id)}
              style={{minHeight:100,padding:10,borderRadius:18,border:`3px dashed ${errando===g.id?'var(--coral-2)':g.cor||'var(--sage)'}`,background:errando===g.id?'var(--coral-pale)':g.bg||'var(--sage-pale)',cursor:selItem?'pointer':'default',transition:'all .15s',boxShadow:errando===g.id?'0 5px 0 var(--coral-2)':selItem?`0 5px 0 ${g.cor||'var(--sage-2)'}`:undefined}}>
              <div style={{fontWeight:800,fontSize:13,marginBottom:8,textAlign:'center',color:g.cor||'var(--sage-2)'}}>{g.emoji} {g.label}</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6,justifyContent:'center'}}>
                {aqui.map(it=>(
                  <button key={it.id} onClick={(e)=>{e.stopPropagation();setPostos(p=>{const n={...p};delete n[it.id];return n;});window.playClick();}}
                    title="Tirar daqui" style={{background:'none',border:'none',cursor:'pointer',fontSize:22,padding:2,lineHeight:1}} >
                    {it.emoji}
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      {todos&&<div className="super-feedback ok" style={{marginTop:14,fontSize:16}}>🎉 Separou tudo certinho! {acertos}/{itens.length} corretos!</div>}
    </div>
  );
};

// ── 3. ORDENAR — clicar em ordem crescente/decrescente ──
const GameOrdenar=({onXP,tipo='crescente',maxN=8,qtd=5})=>{
  const gerar=()=>{
    const nums=[];
    while(nums.length<qtd){const n=1+Math.floor(Math.random()*maxN);if(!nums.includes(n))nums.push(n);}
    return{embaralhados:[...nums].sort(()=>Math.random()-.5),ordem:tipo==='crescente'?[...nums].sort((a,b)=>a-b):[...nums].sort((a,b)=>b-a),clicados:[],fb:null};
  };
  const [q,setQ]=useState(gerar);
  useEffect(()=>{window.__falar(tipo==='crescente'?'Toque do menor para o maior!':'Toque do maior para o menor!');},[]);
  const clicar=(n)=>{
    if(q.fb||q.clicados.includes(n))return;
    const esperado=q.ordem[q.clicados.length];
    if(n===esperado){
      window.playClick();
      const nc=[...q.clicados,n];
      if(nc.length===q.ordem.length){
        window.playSuccess();onXP(20);
        window.__falar(window.__fraseCerta()+' Ordem perfeita!');
        setQ(s=>({...s,clicados:nc,fb:'ok'}));
      }else setQ(s=>({...s,clicados:nc}));
    }else{
      window.playRetry();window.__falar(window.__fraseErro());
      setQ(s=>({...s,clicados:[],fb:'ko'}));
      setTimeout(()=>setQ(s=>({...s,fb:null})),600);
    }
  };
  return(
    <div style={{textAlign:'center'}}>
      <div style={{fontWeight:800,fontSize:18,marginBottom:8}}>
        {tipo==='crescente'?'📈 Toque do MENOR para o MAIOR!':'📉 Toque do MAIOR para o MENOR!'}
      </div>
      <div style={{fontSize:13,color:'var(--ink-3)',marginBottom:16}}>
        {tipo==='crescente'?'Comece pelo número mais pequeno':'Comece pelo número mais grande'}
      </div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',justifyContent:'center',marginBottom:16}}>
        {q.embaralhados.map(n=>{
          const feito=q.clicados.includes(n);
          const proximo=n===q.ordem[q.clicados.length];
          return(
            <button key={n} onClick={()=>clicar(n)} disabled={feito||!!q.fb}
              style={{width:62,height:62,borderRadius:18,border:`3px solid ${feito?'var(--sage-2)':q.fb==='ko'?'var(--coral-2)':'var(--ink)'}`,background:feito?'var(--sage-pale)':q.fb==='ko'?'var(--coral-pale)':proximo?'var(--amber-pale)':'var(--surface)',boxShadow:feito?'0 4px 0 var(--sage-2)':proximo?'0 4px 0 var(--amber-2)':'0 4px 0 var(--border-strong)',fontFamily:'Space Grotesk',fontWeight:800,fontSize:26,cursor:feito?'default':'pointer',transition:'all .12s',transform:feito?'translateY(4px)':proximo?'translateY(-3px)':'none'}}>
              {feito?'✓':n}
            </button>
          );
        })}
      </div>
      {q.clicados.length>0&&!q.fb&&(
        <div style={{fontSize:13,color:'var(--ink-3)',marginBottom:8}}>
          Sequência até agora: {q.clicados.join(' → ')}
        </div>
      )}
      {q.fb==='ok'&&<div className="super-feedback ok" style={{fontSize:16}}>🎉 Perfeito! {q.ordem.join(' → ')}</div>}
      {q.fb==='ok'&&<button className="btn btn--primary btn--sm" style={{marginTop:12,fontSize:16}} onClick={()=>setQ(gerar())}>Próximo ➜</button>}
    </div>
  );
};

// ── 4. COMPLETAR SEQUÊNCIA — fill-the-gap numérico ──
const GameCompletarSeq=({onXP,tipo='soma',nivelMax=10})=>{
  const novo=()=>{
    const passo=1+Math.floor(Math.random()*(tipo==='soma'?3:2));
    const inicio=Math.floor(Math.random()*(nivelMax/2));
    const seq=Array.from({length:5},(_,i)=>inicio+i*passo);
    const gapos=[1,2,3].sort(()=>Math.random()-.5).slice(0,2);
    // opções cobrem AMBAS as lacunas
    const ops_set=new Set(gapos.flatMap(g=>[seq[g],seq[g]-passo,seq[g]+passo]));
    while(ops_set.size<4)ops_set.add(Math.max(0,seq[gapos[0]]+Math.floor(Math.random()*4)-1));
    return{seq,gapos,passo,respostas:{},ops:[...ops_set].sort((a,b)=>a-b),fb:null,tentando:gapos[0]};
  };
  const [q,setQ]=useState(novo);
  const escolher=(val)=>{
    if(q.fb||q.tentando===null)return;window.playClick();
    const esperado=q.seq[q.tentando];
    if(val===esperado){
      const nr={...q.respostas,[q.tentando]:val};
      const proxGapo=q.gapos.find(g=>nr[g]===undefined);
      if(proxGapo===undefined){
        window.playSuccess();onXP(20);
        window.__falar(window.__fraseCerta()+' Sequência completa!');
        setQ(s=>({...s,respostas:nr,fb:'ok',tentando:null}));
      }else{
        window.__falar('Isso! Agora o próximo!');
        // gera novas opções cobrindo o próximo gapo
        const pv=q.seq[proxGapo];
        const ns=new Set([pv,pv-q.passo,pv+q.passo,pv+1]);
        while(ns.size<4)ns.add(Math.max(0,pv+Math.floor(Math.random()*4)-1));
        setQ(s=>({...s,respostas:nr,tentando:proxGapo,ops:[...ns].sort((a,b)=>a-b)}));
      }
    }else{
      window.playRetry();window.__falar(window.__fraseErro());
      setQ(s=>({...s,fb:'ko'}));
      setTimeout(()=>setQ(s=>({...s,fb:null})),500);
    }
  };
  return(
    <div style={{textAlign:'center'}}>
      <div style={{fontWeight:800,fontSize:18,marginBottom:8}}>🔢 Complete a sequência!</div>
      <div style={{fontSize:13,color:'var(--ink-3)',marginBottom:20}}>Cada número aumenta de {q.passo} em {q.passo}</div>
      <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap',marginBottom:20}}>
        {q.seq.map((n,i)=>{
          const ehGapo=q.gapos.includes(i);
          const respondido=q.respostas[i]!==undefined;
          const ativo=q.tentando===i;
          return(
            <div key={i} style={{width:60,height:60,borderRadius:16,border:`3px solid ${respondido?'var(--sage-2)':ativo?'var(--amber-2)':ehGapo?'var(--plum)':'var(--ink)'}`,background:respondido?'var(--sage-pale)':ativo?'var(--amber-pale)':ehGapo?'var(--plum-pale)':'var(--surface)',boxShadow:ativo?'0 5px 0 var(--amber-2)':respondido?'0 4px 0 var(--sage-2)':'0 4px 0 var(--ink)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Space Grotesk',fontWeight:800,fontSize:24,animation:ativo?'pulse-border 1.5s infinite':undefined}}>
              {ehGapo?(respondido?q.respostas[i]:'?'):n}
            </div>
          );
        })}
      </div>
      {q.tentando!==null&&<div style={{fontSize:13,color:'var(--amber-2)',fontWeight:700,marginBottom:12}}>
        Qual número vai na posição {q.tentando+1}? (seta: +{q.passo})
      </div>}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
        {q.ops.map(v=>(
          <button key={v} onClick={()=>escolher(v)} disabled={!!q.fb||q.tentando===null}
            className={`super-option${q.fb==='ko'?' ko':''}`} style={{fontSize:22,fontWeight:800,minHeight:56}}>
            {v}
          </button>
        ))}
      </div>
      {q.fb==='ok'&&<div className="super-feedback ok" style={{marginTop:12,fontSize:16}}>🎉 Sequência: {q.seq.join(' → ')}</div>}
      {q.fb==='ok'&&<button className="btn btn--primary btn--sm" style={{marginTop:12}} onClick={()=>setQ(novo())}>Próximo ➜</button>}
    </div>
  );
};

// ── 5. QUEBRA-CABEÇA NUMÉRICO — montar a ordem com peças ──
const GameQuebraCabeca=({onXP,pares,titulo})=>{
  const [embaralhado]=useState(()=>[...pares].sort(()=>Math.random()-.5));
  const [ordem,setOrdem]=useState(Array(pares.length).fill(null));
  const [sel,setSel]=useState(null); // índice do item selecionado
  const [feito,setFeito]=useState(false);
  useEffect(()=>{window.__falar(titulo||'Monte a sequência correta!');},[]);
  const colocar=(pos)=>{
    if(sel===null||ordem[pos]!==null)return;
    const no=[...ordem];no[pos]=embaralhado[sel];
    setOrdem(no);setSel(null);window.playClick();
    // checar se todos colocados corretamente
    const todos=no.every(v=>v);
    if(todos){
      const erros=no.filter((v,i)=>v&&v.id!==pares[i].id).length;
      if(erros===0){window.playSuccess();onXP(25);window.__falar(window.__fraseCerta()+' Quebra-cabeça completo!');setFeito(true);}
      else{
        window.playRetry();
        window.__falar(`Quase! ${erros} ${erros===1?'peça não está':'peças não estão'} no lugar certo. Tenta de novo!`);
        setTimeout(()=>setOrdem(Array(pares.length).fill(null)),800);
      }
    }
  };
  return(
    <div style={{textAlign:'center'}}>
      <div style={{fontWeight:800,fontSize:17,marginBottom:14}}>{titulo||'🧩 Monte a sequência correta!'}</div>
      {/* Slots de destino */}
      <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:16,flexWrap:'wrap'}}>
        {pares.map((p,i)=>(
          <div key={i} onClick={()=>colocar(i)} style={{width:68,minHeight:68,borderRadius:16,border:`3px dashed ${ordem[i]?'var(--sage-2)':'var(--amber-2)'}`,background:ordem[i]?'var(--sage-pale)':sel!==null?'var(--amber-pale)':'var(--surface)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',cursor:sel!==null&&!ordem[i]?'pointer':'default',boxShadow:sel!==null&&!ordem[i]?'0 5px 0 var(--amber-2)':'none',transition:'all .12s',padding:4}}>
            {ordem[i]?<><span style={{fontSize:24}}>{ordem[i].emoji}</span><span style={{fontSize:11,fontWeight:700}}>{ordem[i].label}</span></>:<span style={{fontSize:24,color:'var(--amber-2)'}}>?</span>}
          </div>
        ))}
      </div>
      <div style={{fontSize:12,color:'var(--ink-3)',marginBottom:12}}>
        {sel!==null?'Agora toque em um espaço acima':'👆 Toque em uma peça abaixo para selecioná-la'}
      </div>
      {/* Peças disponíveis */}
      <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center'}}>
        {embaralhado.map((p,i)=>{
          const usada=ordem.includes(p);
          return(
            <button key={i} onClick={()=>{if(!usada){setSel(sel===i?null:i);window.playClick();}}} disabled={usada}
              style={{padding:'10px 14px',borderRadius:16,border:`3px solid ${sel===i?'var(--plum)':usada?'var(--border)':'var(--ink)'}`,background:sel===i?'var(--plum-pale)':usada?'var(--surface-2)':'var(--surface)',boxShadow:sel===i?'0 5px 0 var(--plum)':usada?'none':'0 4px 0 var(--ink)',opacity:usada?.35:1,cursor:usada?'default':'pointer',fontFamily:'inherit',transition:'all .12s',transform:sel===i?'translateY(-3px)':'none'}}>
              <div style={{fontSize:24}}>{p.emoji}</div>
              <div style={{fontSize:11,fontWeight:700}}>{p.label}</div>
            </button>
          );
        })}
      </div>
      {feito&&<div className="super-feedback ok" style={{marginTop:14,fontSize:16}}>🧩 Perfeito! Sequência montada!</div>}
    </div>
  );
};

const normTxt=(s='')=>s.toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const indexarConteudoLivro=(conteudo='',nome='')=>{
  const base=normTxt(conteudo+' '+nome);
  const termos=['fração','fracao','decimal','porcentagem','área','area','perímetro','perimetro','valor posicional','gráfico','grafico','tabela','probabilidade','razão','razao','proporção','proporcao','ângulo','angulo','medida','multiplicação','multiplicacao','divisão','divisao','sequência','sequencia'];
  const encontrados=termos.filter(t=>base.includes(normTxt(t)));
  const codigos=[...new Set((conteudo.match(/EF\d{2}MA\d{2}/g)||[]))];
  const capitulos=[...new Set((conteudo.match(/Capítulo\s+\d+[^\n]{0,60}/gi)||[]).slice(0,12))];
  return {termos:encontrados,codigos,capitulos,resumo:conteudo.slice(0,1200)};
};
const getBaseLivros=(livros=[])=>[
  ...Object.values(SESI_LIVROS_INDEXADOS),

];
const buscarNoIndice=(pergunta='',livros=[])=>{
  const q=normTxt(pergunta);
  const palavras=q.split(/\W+/).filter(w=>w.length>3);
  return getBaseLivros(livros).map(l=>{
    const texto=normTxt([l.nome,l.serie,l.disciplina,...(l.capitulos||[]),...(l.codigos||[]),...(l.destaques||[]),...(l.recursos||[]),l.conteudo||''].join(' '));
    const score=palavras.reduce((acc,w)=>acc+(texto.includes(w)?1:0),0)+(q.includes(normTxt(l.serie||''))?2:0);
    return {...l,score};
  }).filter(l=>l.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
};
const respostaConceito=(q)=>{
  const s=normTxt(q);
  if(s.includes('fracao')||s.includes('fração'))return 'Fração mostra uma parte de um todo. Primeiro veja em quantas partes iguais o inteiro foi dividido; depois conte quantas partes foram escolhidas. Exemplo: 2 partes pintadas de 4 partes iguais = 2/4.';
  if(s.includes('area')||s.includes('área'))return 'Área é o espaço que uma figura ocupa por dentro. Na malha quadriculada, conte os quadradinhos ocupados. Perímetro é o contorno: some todos os lados ao redor.';
  if(s.includes('perimetro')||s.includes('perímetro'))return 'Perímetro é a medida do contorno. Imagine caminhar ao redor da figura: some cada lado. Se for um retângulo, some largura + largura + comprimento + comprimento.';
  if(s.includes('valor posicional')||s.includes('posicional'))return 'Valor posicional é o valor do algarismo de acordo com o lugar que ele ocupa. No número 5.291, o 5 vale 5.000; no número 1.925, o 5 vale 5.';
  if(s.includes('grafico')||s.includes('gráfico')||s.includes('tabela'))return 'Para ler gráfico ou tabela: olhe o título, observe as categorias, compare as quantidades e responda usando os dados. Pictogramas ajudam quando cada desenho representa uma quantidade.';
  if(s.includes('probabilidade')||s.includes('possivel')||s.includes('impossivel'))return 'Probabilidade ajuda a pensar se algo é impossível, pouco provável, provável ou certo. Conte os resultados favoráveis e compare com todos os resultados possíveis.';
  if(s.includes('razao')||s.includes('razão')||s.includes('proporcao')||s.includes('proporção'))return 'Razão compara duas grandezas. Proporção aparece quando duas razões mantêm a mesma relação, como dobrar uma receita ou usar escala em um mapa.';
  if(s.includes('sequencia')||s.includes('sequência'))return 'Sequência tem um padrão. Procure o que muda de um termo para o outro: soma 1, soma 2, dobra, diminui ou alterna formas/cores.';
  if(s.includes('atividade')||s.includes('adaptar')||s.includes('jogo'))return 'Posso transformar o conteúdo em jogo curto: apresentar um visual, pedir uma ação do aluno, dar pista, registrar acerto e sugerir mediação. Use comandos como: “crie atividade de área para 5º ano”.';
  return 'Vou te ajudar com uma resposta curta, visual e aplicável. Posso explicar o conceito, criar uma atividade, sugerir pistas para mediação ou indicar qual fase do jogo trabalha essa habilidade.';
};
